<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Waggle 🐾 Premium UI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader" style="position:fixed; inset:0; z-index:30000; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:32px;">Waggle🐾</div>
    <div id="toast"></div>
    <div id="lightbox-modal" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <div id="auth-screen" class="screen-container">
        <div class="auth-card">
            <h1 class="logo-title">Waggle.</h1>
            <p style="margin-bottom: 25px; font-size: 16px; font-weight: 700; color: var(--text-muted);">Dołącz do stada! 🐕</p>
            <input type="email" id="authEmail" placeholder="E-mail">
            <input type="password" id="authPass" placeholder="Hasło">
            <div style="margin-top: 10px;">
                <button class="btn-main" id="loginBtn">ZALOGUJ SIĘ</button>
                <button class="btn-outline" id="registerBtn" style="margin-top: 12px;">REJESTRACJA</button>
            </div>
            <div class="legal-checkbox-container" style="justify-content: center; margin-top: 25px;">
                <input type="checkbox" id="legalTerms">
                <label for="legalTerms" style="font-size: 12px; font-weight: 700; color: var(--text-muted);">Akceptuję Regulamin Waggle.</label>
            </div>
        </div>
    </div>

    <div id="app-interface" class="screen-container">
        <section id="view-map" class="view-section active">
            <div id="map-ui-layer">
                <div id="top-widgets">
                    <div class="top-pill" id="weatherWidgetBtn" style="cursor:pointer;">☀️ <span id="weather-temp">--°C</span></div>
                    <div id="active-alert-pill" class="top-pill" style="display:none; background:var(--danger); color:white; cursor:pointer;">⚠️ Alerty!</div>
                </div>
                <div id="ctrl-panel">
                    <button class="map-ctrl-btn" id="centerBtn">🎯</button>
                    <button class="map-ctrl-btn danger" id="triggerAlertBtn">⚠️</button>
                </div>
                <div id="walk-setup-panel">
                    <input type="text" id="statusInput" placeholder="Co u Was?" style="margin-bottom: 10px;">
                    <button class="btn-main" id="startWalkBtn">WYJDŹ NA SPACER 🐾</button>
                    <button class="btn-main" id="stopWalkBtn" style="display:none; background:var(--text-color);">ZAKOŃCZ 🏁</button>
                </div>
            </div>
            <div id="map"></div>
        </section>

        <section id="view-community" class="view-section">
            <div class="sticky-header">
                <h3 style="margin:0;">W okolicy</h3>
                <div id="stories-container"></div>
                <button class="btn-main" id="addPostBtn" style="margin-top:15px; padding: 12px; background:var(--secondary);">➕ DODAJ POSTA</button>
            </div>
            <div id="posts-container"></div>
        </section>

        <section id="view-wiki" class="view-section">
            <div class="sticky-header" style="padding-bottom: 10px;">
                <h3 style="margin:0;">Psia Wiedza</h3>
                <div class="wiki-tabs">
                    <button class="wiki-tab-btn active" data-tab="rasy">Rasy Psów</button>
                    <button class="wiki-tab-btn" data-tab="trening">Szkolenie</button>
                    <button class="wiki-tab-btn" data-tab="sytuacje">Sytuacje</button>
                </div>
            </div>
            <div id="wiki-content" style="padding:0 10px;"></div>
        </section>

        <section id="view-chat" class="view-section">
            <div class="sticky-header"><h3 style="margin:0;">Wiadomości</h3></div>
            <div id="inbox-container"></div>
            <div id="chat-window" class="chat-overlay">
                <div class="chat-header">
                    <button id="closeChatBtn" class="icon-btn">⬅️</button>
                    <b id="chatPartnerName" style="font-size: 18px;">Czat</b>
                </div>
                <div id="chatMessages"></div>
                <div class="chat-footer">
                    <input type="text" id="chatInput" placeholder="Napisz wiadomość..." style="margin:0; border-radius:50px; flex:1;">
                    <button id="sendMsgBtn" class="btn-main" style="width: auto; margin:0; padding: 14px 24px; border-radius:50px;">WYŚLIJ</button>
                </div>
            </div>
        </section>

        <section id="view-profile" class="view-section">
            <div class="profile-header" style="padding:30px 20px; text-align:center;">
                <img id="profileAvatar" src="" style="width:120px; height:120px; border-radius:50%; border:4px solid white; box-shadow:var(--soft-shadow); object-fit:cover;">
                <h2 id="profileNameDisplay" style="margin: 15px 0 5px 0; font-weight:900; font-size:26px;">...</h2>
                <div class="stats-bar">
                    <div style="flex:1;"><b id="statWalks" class="stat-num" style="color: var(--primary);">0</b><br><small style="color:var(--text-muted); font-weight:700;">Spacerów</small></div>
                    <div style="flex:1;"><b id="statDist" class="stat-num" style="color: var(--secondary);">0.0</b><br><small style="color:var(--text-muted); font-weight:700;">KM</small></div>
                </div>
                <div class="profile-actions" style="margin-top: 25px; display: flex; flex-direction: column; gap: 15px; padding: 0 10px;">
                    <button class="btn-main" id="openEditProfileBtn" style="background: var(--secondary);">✏️ EDYTUJ PROFIL</button>
                    <button class="btn-main" id="openSettingsBtn" style="background: #576574;">⚙️ USTAWIENIA</button>
                    <button class="btn-outline" id="logoutBtn" style="color: var(--danger); border-color: var(--danger);">WYLOGUJ SIĘ</button>
                </div>
            </div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" data-view="map">📍<span>Mapa</span></button>
            <button class="nav-item" data-view="community">📱<span>Tablica</span></button>
            <button class="nav-item" data-view="wiki">📘<span>Wiedza</span></button>
            <button class="nav-item" data-view="chat">💬<span>Czat</span></button>
            <button class="nav-item" data-view="profile">👤<span>Profil</span></button>
        </nav>
    </div>

    <div id="post-creator-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="font-weight:900; margin-top:0;">Nowy Post</h3>
            <textarea id="postContent" placeholder="Co słychać u pieska?" style="min-height: 100px; resize: none;"></textarea>
            
            <div id="post-image-preview-container" style="display:none; position:relative; margin-bottom:15px;">
                <img id="post-image-preview" src="" style="width:100%; border-radius:15px; max-height:200px; object-fit:cover;">
                <button id="removePostImageBtn" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.5); color:white; border:none; border-radius:50%; width:30px; height:30px; cursor:pointer;">✕</button>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button class="btn-outline" id="addPhotoBtn" style="margin-top:0; flex:1;">📷 DODAJ ZDJĘCIE</button>
                <input type="file" id="postImageInput" accept="image/*" style="display:none;">
            </div>

            <button class="btn-main" id="publishPostBtn">OPUBLIKUJ</button>
        </div>
    </div>

    <div id="alert-hub-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="color:var(--danger); font-weight:900; margin-top:0;">⚠️ Zagrożenia</h3>
            <div id="alert-hub-list" style="max-height: 350px; overflow-y: auto; text-align: left; margin-top: 10px; padding-right: 10px;"></div>
        </div>
    </div>

    <div id="profile-setup-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="font-weight:900; font-size:24px; margin-top:0;">Profil Psa</h3>
            <input type="text" id="setupName" placeholder="Imię psa">
            <input type="text" id="setupCity" placeholder="Miasto">
            <input type="text" id="setupBreed" placeholder="Rasa">
            <select id="setupRoutine">
                <option value="brak">Kiedy zwykle spacerujecie?</option>
                <option value="Rano">Rano 🌅</option>
                <option value="Popołudniu">Popołudniu ☀️</option>
                <option value="Wieczorem">Wieczorem 🌙</option>
            </select>
            <button class="btn-main" id="saveProfileBtn">ZAPISZ</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="font-weight:900; margin-top:0;">Ustawienia</h3>
            <div style="text-align:left; margin-bottom:15px;">
                <label style="font-size:12px; font-weight:800; color:var(--text-muted);">Wygląd</label>
                <select id="settingTheme">
                    <option value="light">☀️ Jasny</option>
                    <option value="dark">🌙 Ciemny</option>
                </select>
            </div>
            <div style="text-align:left; margin-bottom:20px;">
                <label style="font-size:12px; font-weight:800; color:var(--text-muted);">Wielkość tekstu</label>
                <select id="settingFontSize">
                    <option value="14px">Mała (Domyślna)</option>
                    <option value="16px">Średnia</option>
                    <option value="18px">Duża</option>
                </select>
            </div>
            <div class="legal-checkbox-container">
                <input type="checkbox" id="settingSearchable">
                <label for="settingSearchable" style="font-size:13px; font-weight:700;">Chcę być widoczny na mapie dla innych psów.</label>
            </div>
            <div class="legal-checkbox-container" style="margin-bottom:20px;">
                <input type="checkbox" id="settingNotifs">
                <label for="settingNotifs" style="font-size:13px; font-weight:700;">Dźwięki i wibracje</label>
            </div>
            <button class="btn-main" id="saveSettingsBtn">ZAPISZ USTAWIENIA</button>
        </div>
    </div>

    <div id="weather-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="font-weight:900; margin-top:0;">Prognoza Pogody ⛅</h3>
            <div id="weather-forecast-content" style="text-align:left;">Ładowanie pogody...</div>
        </div>
    </div>

    <div id="alert-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="color:var(--danger); font-weight:900; margin-top:0;">⚠️ Zgłoś Zagrożenie</h3>
            <p style="font-size:13px; margin-top:0; color:var(--text-muted); font-weight:700;">Zaznacz na mapie szkło, trutkę lub agresywnego psa.</p>
            <input type="text" id="alertTextInput" placeholder="Co się stało? (np. Szkło)">
            <button class="btn-main" id="saveAlertBtn" style="background:var(--danger);">POSTAW ZNACZNIK</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script type="module" src="src/app.js"></script>
</body>
</html>
