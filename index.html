<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Waggle v22.0 🐾 Professional</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader">Waggle🐾</div>
    <div id="toast">Sukces!</div>

    <!-- EKRAN LOGOWANIA -->
    <div id="auth-screen" class="screen-container">
        <div class="auth-content">
            <h1>Waggle.</h1>
            <p data-i18n="auth_subtitle">Dołącz do stada! 🐕</p>
            <input type="email" id="authEmail" placeholder="E-mail">
            <input type="password" id="authPass" placeholder="Hasło">
            <button class="btn-main" id="loginBtn" data-i18n="btn_login">ZALOGUJ SIĘ</button>
            <button class="btn-outline" id="registerBtn" data-i18n="btn_register">REJESTRACJA</button>
        </div>
    </div>

    <!-- GŁÓWNY INTERFEJS -->
    <div id="app-interface" class="screen-container">
        <section id="view-map" class="view-section active">
            <div id="ctrl-panel">
                <button class="map-ctrl-btn" id="centerBtn">🎯</button>
                <button class="map-ctrl-btn danger" id="triggerAlertBtn">⚠️</button>
            </div>
            <div id="map"></div>
            <div id="walk-setup-panel">
                <div id="walk-inputs-group">
                    <input type="text" id="statusInput" placeholder="Co u Was?">
                </div>
                <button class="btn-main" id="startWalkBtn" data-i18n="btn_start_walk">WYJDŹ NA SPACER 🐾</button>
                <button class="btn-main" id="stopWalkBtn" style="display:none; background:var(--text-color);">ZAKOŃCZ 🏁</button>
            </div>
        </section>

        <section id="view-community" class="view-section">
            <div class="sticky-header">
                <h3 data-i18n="title_nearby">W okolicy</h3>
                <div id="stories-container"></div>
                <button class="btn-main" id="addPostBtn">➕ DODAJ POSTA</button>
            </div>
            <div id="posts-container"></div>
        </section>

        <section id="view-chat" class="view-section">
            <div id="inbox-container"></div>
            <!-- Aktywne okno czatu (nakładka) -->
            <div id="chat-window" class="chat-overlay">
                <div class="chat-header">
                    <button id="closeChatBtn">←</button>
                    <b id="chatPartnerName">Czat</b>
                </div>
                <div id="chatMessages"></div>
                <div class="chat-footer">
                    <input type="text" id="chatInput" placeholder="Napisz wiadomość...">
                    <button id="sendMsgBtn">OK</button>
                </div>
            </div>
        </section>

        <section id="view-profile" class="view-section">
            <div class="profile-header">
                <img id="profileAvatar" src="">
                <h2 id="profileNameDisplay">...</h2>
                <div class="stats-bar">
                    <div><b id="statWalks">0</b><br><small>Spacerów</small></div>
                    <div><b id="statDist">0.0</b><br><small>KM</small></div>
                </div>
                <button class="btn-main" id="logoutBtn">WYLOGUJ SIĘ</button>
            </div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" data-view="map">📍<span data-i18n="nav_map">Mapa</span></button>
            <button class="nav-item" data-view="community">📱<span data-i18n="nav_board">Tablica</span></button>
            <button class="nav-item" data-view="chat">💬<span data-i18n="nav_chat">Czat</span></button>
            <button class="nav-item" data-view="profile">👤<span data-i18n="nav_profile">Profil</span></button>
        </nav>
    </div>

    <!-- SKRYPTY -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- GŁÓWNY MODUŁ -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
