<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- KONFIGURACJA PWA: Pozwala dodać apkę do ekranu głównego telefonu -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff5252">

    <title>Waggle v21.32 🐾 Kompletny System</title>
    
    <!-- BIBLIOTEKI ZEWNĘTRZNE -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #ff5252; --secondary: #34ace0; --bg-color: #f4f6f8; 
            --panel-bg: #ffffff; --text-color: #2c3e50; --border-color: #f1f2f6;
            --text-muted: #a4b0be; --danger: #ff5252; --gold: #ffb142;
            --nav-height: 75px; --soft-shadow: 0 10px 25px rgba(149, 157, 165, 0.15);
        }
        
        body { margin: 0; padding: 0; height: 100vh; width: 100vw; background: #e1e5eb; font-family: 'Nunito', sans-serif; overflow: hidden; display: flex; justify-content: center; color: var(--text-color); }
        
        /* TWARDA IZOLACJA EKRANÓW - zapobiega wyświetlaniu logowania i apki naraz */
        .screen-container { width: 100%; max-width: 480px; height: 100%; background: var(--bg-color); position: relative; overflow: hidden; display: none; flex-direction: column; }
        .screen-container.active { display: flex !important; }

        /* MODALE I POWIADOMIENIA */
        .modal { position: fixed; inset: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(3px); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .card { background: var(--panel-bg); width: 100%; max-width: 380px; border-radius: 28px; padding: 25px; text-align: center; position: relative; box-shadow: var(--soft-shadow); max-height: 85vh; overflow-y: auto; }
        
        /* NAWIGACJA DOLNA */
        .bottom-nav { min-height: var(--nav-height); flex-shrink: 0; background: var(--panel-bg); display: flex; justify-content: space-around; align-items: center; z-index: 15000; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -10px 20px rgba(0,0,0,0.03); border-radius: 30px 30px 0 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; flex: 1; border: none; background: none; font-size: 11px; font-weight: 800; outline: none; }
        .nav-item.active { color: var(--primary); }
        
        /* SEKCJE WIDOKÓW */
        .view-section { flex: 1; width: 100%; display: none; overflow-y: auto; background: var(--bg-color); position: relative; }
        .view-section.active { display: block; }

        /* ELEMENTY MAPY */
        #map { top: 0; left: 0; right: 0; bottom: 0; position: absolute; z-index: 1; }
        .sos-btn { position: absolute; top: 15px; left: 15px; z-index: 10000; background: var(--danger); color: white; border: 4px solid white; border-radius: 50%; width: 55px; height: 55px; font-weight: 900; box-shadow: var(--soft-shadow); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #walk-panel { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; z-index: 5000; background: var(--panel-bg); border-radius: 24px; padding: 15px; box-shadow: var(--soft-shadow); box-sizing: border-box; }

        /* POSTY NA TABLICY */
        .post-card { background: var(--panel-bg); margin: 15px; border-radius: 24px; padding: 0; overflow: hidden; box-shadow: var(--soft-shadow); }
        .post-img { width: 100%; height: 210px; object-fit: cover; background: #eee; display: block; }
        .post-content { padding: 18px; }

        /* FORMULARZE I PRZYCISKI */
        .btn-main { background: var(--primary); color: white; border: none; font-weight: 800; padding: 14px; border-radius: 50px; width: 100%; cursor: pointer; font-size: 13px; transition: transform 0.2s; }
        .btn-main:active { transform: scale(0.98); }
        input, textarea { width: 100%; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--border-color); background: var(--bg-color); margin-bottom: 10px; font-family: inherit; box-sizing: border-box; outline: none; }
        
        /* STATYSTYKI W PROFILU */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .stat-box { background: var(--border-color); padding: 15px; border-radius: 20px; text-align: center; }
        .stat-val { display: block; font-size: 22px; font-weight: 900; color: var(--primary); }
        .stat-lbl { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="loader" style="position:fixed; inset:0; z-index:30000; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:900;">Waggle🐾</div>

    <!-- 1. EKRAN LOGOWANIA -->
    <div id="auth-screen" class="screen-container">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:40px;">
            <h1 style="text-align:center; color:var(--primary); font-size:55px; font-weight:900; margin:0;">Waggle.</h1>
            <p style="text-align:center; color:var(--text-muted); font-weight:800; margin-bottom:35px;">Twoja psia społeczność 🐕</p>
            <input type="email" id="authEmail" placeholder="E-mail">
            <input type="password" id="authPass" placeholder="Hasło">
            <button class="btn-main" onclick="handleLogin()">ZALOGUJ SIĘ</button>
            <button class="btn-main" style="background:var(--text-color); margin-top:10px;" onclick="handleRegister()">NOWE KONTO</button>
        </div>
    </div>

    <!-- 2. GŁÓWNY INTERFEJS APLIKACJI -->
    <div id="app-interface" class="screen-container">
        
        <!-- WIDOK: MAPA -->
        <section id="view-map" class="view-section active">
            <button class="sos-btn" onclick="triggerSOS()">SOS</button>
            <div id="map"></div>
            <div id="walk-panel">
                <div id="walk-pre">
                    <input type="text" id="statusMsg" placeholder="Gdzie dziś spacerujecie?">
                    <button class="btn-main" onclick="startWalk()">ROZPOCZNIJ SPACER 🐾</button>
                </div>
                <div id="walk-active" style="display:none; text-align:center;">
                    <div style="margin-bottom:10px; font-weight:900; color:var(--secondary);">TRWA SPACER...</div>
                    <button class="btn-main" style="background:var(--text-color);" onclick="stopWalk()">ZAKOŃCZ I ZAPISZ 🏁</button>
                </div>
            </div>
        </section>

        <!-- WIDOK: TABLICA (POSTY) -->
        <section id="view-community" class="view-section">
            <div style="padding:20px; background:var(--bg-color); position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0; font-weight:900; font-size:24px;">Tablica stada</h2>
                <button onclick="document.getElementById('post-modal').style.display='flex'" style="background:var(--primary); color:white; border:none; width:45px; height:45px; border-radius:50%; font-weight:900; font-size:20px;">+</button>
            </div>
            <div id="posts-feed" style="padding-bottom:20px;"></div>
        </section>

        <!-- WIDOK: WIKI (WIEDZA) -->
        <section id="view-wiki" class="view-section">
            <div style="padding:20px;"><h2 style="font-weight:900; font-size:24px;">Encyklopedia ras</h2></div>
            <div id="wiki-list" style="padding:0 5px 20px 5px;"></div>
        </section>

        <!-- WIDOK: CZAT -->
        <section id="view-chat" class="view-section">
            <div style="padding:20px;"><h2 style="font-weight:900; font-size:24px;">Wiadomości</h2></div>
            <div id="inbox" style="padding:0 5px;"></div>
            
            <!-- OKNO AKTYWNEGO CZATU (FULLSCREEN NAKŁADKA) -->
            <div id="chat-window" style="display:none; position:absolute; inset:0; background:var(--bg-color); z-index:20000; flex-direction:column;">
                <div style="padding:15px; background:white; display:flex; align-items:center; gap:12px; box-shadow:var(--soft-shadow);">
                    <button onclick="closeChat()" style="border:none; background:#eee; width:35px; height:35px; border-radius:50%; font-size:18px; font-weight:900;">←</button>
                    <b id="chat-with-name" style="font-size:18px;">Rozmowa</b>
                </div>
                <div id="msg-history" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px;"></div>
                <div style="padding:15px; background:white; display:flex; gap:10px;">
                    <input type="text" id="msg-input" placeholder="Napisz do pieska..." style="margin:0;">
                    <button onclick="sendMsg()" class="btn-main" style="width:70px; margin:0;">WYŚLIJ</button>
                </div>
            </div>
        </section>

        <!-- WIDOK: PROFIL I STATYSTYKI -->
        <section id="view-profile" class="view-section">
            <div style="padding:40px 20px; text-align:center;">
                <div id="p-avatar" style="width:120px; height:120px; border-radius:50%; background:#ddd; margin:0 auto 20px; border:5px solid white; box-shadow:var(--soft-shadow); overflow:hidden;"></div>
                <h2 id="p-name" style="margin:0; font-weight:900; font-size:28px;">Ładowanie...</h2>
                <p id="p-breed" style="color:var(--text-muted); font-weight:800; font-size:16px; margin:8px 0 25px 0;"></p>
                
                <div class="stat-grid">
                    <div class="stat-box"><span class="stat-val" id="st-walks">0</span><span class="stat-lbl">Spacerów</span></div>
                    <div class="stat-box"><span class="stat-val" id="st-dist">0.0</span><span class="stat-lbl">KM Dystansu</span></div>
                </div>

                <button class="btn-main" style="background:var(--secondary); margin-top:15px;" onclick="alert('Edycja profilu w v21.33!')">EDYTUJ DANE</button>
                <button class="btn-main" style="background:var(--border-color); color:var(--text-color); margin-top:12px;" onclick="handleLogout()">WYLOGUJ SIĘ</button>
            </div>
        </section>

        <!-- DOLNA NAWIGACJA -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('map', this)">📍<span>Mapa</span></div>
            <div class="nav-item" onclick="switchTab('community', this)">📱<span>Tablica</span></div>
            <div class="nav-item" onclick="switchTab('wiki', this)">📘<span>Wiki</span></div>
            <div class="nav-item" onclick="switchTab('chat', this)">💬<span>Czat</span></div>
            <div class="nav-item" onclick="switchTab('profile', this)">👤<span>Profil</span></div>
        </nav>
    </div>

    <!-- MODAL: NOWY POST -->
    <div id="post-modal" class="modal"><div class="card">
        <button onclick="this.parentElement.parentElement.style.display='none'" style="position:absolute; top:15px; right:15px; border:none; background:none; font-size:20px; font-weight:900; cursor:pointer;">✕</button>
        <h3 style="font-weight:900; margin-top:0;">Dodaj post do stada</h3>
        <input type="text" id="post-img-url" placeholder="Link do zdjęcia (URL)">
        <textarea id="post-text" placeholder="Co u Twojego pieska?" style="height:100px; resize:none;"></textarea>
        <button class="btn-main" onclick="addPost()">OPUBLIKUJ TERAZ</button>
    </div></div>

    <!-- SKRYPTY FIREBASE I LEAFLET -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. KONFIGURACJA FIREBASE
        const firebaseConfig = { 
            apiKey: "AIzaSyA7CSlyOLzbz2LpO0C-KqaZQ0U_OrNqBcg", 
            authDomain: "waggle-app-31ffa.firebaseapp.com", 
            projectId: "waggle-app-31ffa", 
            storageBucket: "waggle-app-31ffa.firebasestorage.app", 
            messagingSenderId: "711707392068", 
            appId: "1:711707392068:web:b81c7e0714cfe24dd1e411" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); 
        const auth = firebase.auth();

        // ZMIENNE GLOBALNE
        let map, userUid, myLat, myLng, isWalking = false, myMarker, activeChatId;

        // 2. MONITOROWANIE STANU ZALOGOWANIA
        auth.onAuthStateChanged(user => {
            document.getElementById('loader').style.display = 'none';
            if (user) {
                userUid = user.uid;
                // Twarda izolacja: usuwamy klasę z logowania, dodajemy do apki
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('app-interface').classList.add('active');
                initApp(); // Uruchamiamy funkcje aplikacji
            } else {
                document.getElementById('app-interface').classList.remove('active');
                document.getElementById('auth-screen').classList.add('active');
            }
        });

        // 3. INICJALIZACJA APLIKACJI
        function initApp() {
            initMap();
            loadWiki();
            loadPosts();
            loadInbox();
            
            // Pobieranie danych profilowych w czasie rzeczywistym
            db.collection("users").doc(userUid).onSnapshot(doc => {
                if(doc.exists) {
                    const d = doc.data();
                    document.getElementById('p-name').innerText = d.name || "Mój Piesek";
                    document.getElementById('p-breed').innerText = d.breed || "Rasa nieustalona";
                    document.getElementById('st-walks').innerText = d.walks || 0;
                    document.getElementById('st-dist').innerText = (d.dist || 0).toFixed(1);
                    if(d.avatar) document.getElementById('p-avatar').innerHTML = `<img src="${d.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
                }
            });
        }

        // 4. MODUŁ MAPY I GPS
        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([52.229, 21.01], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            // Śledzenie lokalizacji użytkownika
            navigator.geolocation.watchPosition(pos => {
                myLat = pos.coords.latitude; myLng = pos.coords.longitude;
                if(!myMarker) {
                    myMarker = L.circleMarker([myLat, myLng], { radius: 9, color: '#fff', fillColor: '#34ace0', fillOpacity: 1, weight: 3 }).addTo(map);
                    map.setView([myLat, myLng], 15);
                } else { 
                    myMarker.setLatLng([myLat, myLng]); 
                }
                
                // Jeśli spacer trwa, wysyłamy pozycję do bazy dla innych użytkowników
                if(isWalking) {
                    db.collection("walks").doc(userUid).set({ 
                        lat: myLat, lng: myLng, 
                        name: document.getElementById('p-name').innerText, 
                        time: Date.now() 
                    }, {merge:true});
                }
            }, null, { enableHighAccuracy: true });
        }

        // FUNKCJE SPACERU
        function startWalk() {
            isWalking = true;
            document.getElementById('walk-pre').style.display = 'none';
            document.getElementById('walk-active').style.display = 'block';
        }

        function stopWalk() {
            isWalking = false;
            db.collection("walks").doc(userUid).delete(); // Usuwamy z mapy aktywnych
            // Aktualizujemy statystyki w profilu użytkownika
            db.collection("users").doc(userUid).update({ 
                walks: firebase.firestore.FieldValue.increment(1) 
            });
            alert("Spacer zakończony! Statystyki zaktualizowane.");
            location.reload(); // Odświeżamy interfejs
        }

        // 5. MODUŁ TABLICY (POSTY ZE ZDJĘCIAMI)
        function loadPosts() {
            db.collection("posts").orderBy("time", "desc").onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `
                        <div class="post-card">
                            ${d.img ? `<img src="${d.img}" class="post-img" onerror="this.style.display='none'">` : ''}
                            <div class="post-content">
                                <b style="font-size:16px;">${d.author}</b>
                                <p style="margin:8px 0; font-size:14px; line-height:1.4;">${d.text}</p>
                                <small style="color:var(--text-muted); font-size:10px;">${new Date(d.time).toLocaleString()}</small>
                            </div>
                        </div>`;
                });
                document.getElementById('posts-feed').innerHTML = html || "<p style='text-align:center; padding:40px; color:var(--text-muted);'>Brak postów. Bądź pierwszy!</p>";
            });
        }

        function addPost() {
            const txt = document.getElementById('post-text').value;
            const img = document.getElementById('post-img-url').value;
            if(!txt) return;
            
            db.collection("posts").add({ 
                text: txt, img: img, 
                author: document.getElementById('p-name').innerText, 
                time: Date.now() 
            });
            
            document.getElementById('post-modal').style.display = 'none';
            document.getElementById('post-text').value = "";
            document.getElementById('post-img-url').value = "";
        }

        // 6. MODUŁ WIKI (ENKLYKLOPEDIA)
        function loadWiki() {
            db.collection("wiki_breeds").orderBy("name").limit(20).onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `
                        <div class="post-card" style="padding:18px;">
                            <h4 style="margin:0 0 8px 0; color:var(--primary); font-size:18px;">${d.name}</h4>
                            <p style="font-size:13px; margin:0; line-height:1.5;">${d.desc_pl}</p>
                        </div>`;
                });
                document.getElementById('wiki-list').innerHTML = html || "<p style='text-align:center; color:var(--text-muted);'>Wczytywanie bazy wiedzy...</p>";
            });
        }

        // 7. MODUŁ CZATU (INBOX + OKNO)
        function loadInbox() {
            // Szukamy wiadomości wysłanych DO NAS
            db.collection("messages").where("to", "==", userUid).orderBy("time", "desc").onSnapshot(snap => {
                let html = "";
                const seen = new Set();
                snap.forEach(doc => {
                    const m = doc.data();
                    if(!seen.has(m.from)) {
                        html += `
                            <div class="post-card" style="padding:18px; cursor:pointer; border-left: 5px solid var(--primary);" onclick="openChat('${m.from}', '${m.author}')">
                                <b>Wiadomość od: ${m.author}</b><br>
                                <small style="color:var(--text-muted);">${m.text.substring(0, 30)}...</small>
                            </div>`;
                        seen.add(m.from);
                    }
                });
                document.getElementById('inbox').innerHTML = html || "<p style='text-align:center; padding:40px; color:var(--text-muted);'>Brak nowych wiadomości.</p>";
            });
        }

        function openChat(partnerId, partnerName) {
            activeChatId = partnerId;
            document.getElementById('chat-with-name').innerText = partnerName;
            document.getElementById('chat-window').style.display = 'flex';
            
            // Pobieranie historii rozmowy (TYLKO między mną a partnerem)
            db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    if((m.from == userUid && m.to == partnerId) || (m.from == partnerId && m.to == userUid)) {
                        const isMe = m.from == userUid;
                        html += `
                            <div style="align-self:${isMe?'flex-end':'flex-start'}; 
                                        background:${isMe? 'var(--primary)':'var(--border-color)'}; 
                                        color:${isMe?'white':'var(--text-color)'}; 
                                        padding:12px 16px; border-radius:18px; max-width:80%; font-weight:700; font-size:14px;">
                                ${m.text}
                            </div>`;
                    }
                });
                const hist = document.getElementById('msg-history');
                hist.innerHTML = html;
                hist.scrollTop = hist.scrollHeight; // Autoscroll do dołu
            });
        }

        function closeChat() { document.getElementById('chat-window').style.display = 'none'; }
        
        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value; if(!text) return;
            
            db.collection("messages").add({ 
                from: userUid, to: activeChatId, 
                author: document.getElementById('p-name').innerText, 
                text: text, time: Date.now() 
            });
            input.value = "";
        }

        // --- NAWIGACJA MIĘDZY ZAKŁADKAMI ---
        function switchTab(tabId, element) {
            // Ukrywamy wszystkie sekcje
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            // Pokazujemy wybraną
            document.getElementById('view-'+tabId).classList.add('active');
            // Zmieniamy kolor ikonki w menu
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            element.classList.add('active');
            // Odświeżenie mapy (ważne przy zmianie widoku)
            if(tabId == 'map' && map) setTimeout(() => map.invalidateSize(), 200);
        }

        // --- SYSTEM SOS ---
        function triggerSOS() {
            const tel = prompt("🚨 SOS: Podaj numer telefonu dla ratowników:");
            if(tel) {
                db.collection("sos").add({ 
                    lat: myLat, lng: myLng, tel: tel, 
                    author: document.getElementById('p-name').innerText, 
                    time: Date.now() 
                });
                alert("SYGNAŁ SOS WYSŁANY!");
            }
        }

        // --- OBSŁUGA AUTORYZACJI ---
        function handleLogin() { 
            const e = document.getElementById('authEmail').value;
            const p = document.getElementById('authPass').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert("Błąd: " + err.message)); 
        }
        function handleRegister() { 
            const e = document.getElementById('authEmail').value;
            const p = document.getElementById('authPass').value;
            auth.createUserWithEmailAndPassword(e, p).then(cred => {
                // Tworzymy pusty profil w Firestore przy rejestracji
                db.collection("users").doc(cred.user.uid).set({
                    name: "Nowy Piesek", breed: "Nieustalona", walks: 0, dist: 0
                });
            }).catch(err => alert("Błąd: " + err.message)); 
        }
        function handleLogout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
