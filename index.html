<!DOCTYPE html><html lang="pl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f4f6f8">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1068/1068827.png">

    <title>Waggle v21.19 🐾 Dynamic Wiki</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #ff5252; --secondary: #34ace0; --bg-color: #f4f6f8; 
            --panel-bg: #ffffff; --text-color: #2c3e50; --border-color: #f1f2f6;
            --text-muted: #a4b0be;
            --male: #34ace0; --female: #ff5252; --gold: #ffb142; --danger: #ff5252;
            --nav-height: 75px; 
            --soft-shadow: 0 10px 25px rgba(149, 157, 165, 0.15);
        }
        
        body.dark-mode { 
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #e0e0e0; 
            --border-color: #333333; --text-muted: #888888;
        }
        body.dark-mode #map { filter: brightness(0.8) contrast(1.1); } 
        body.dark-mode .alert-item { background: #3d1c1c; }
        body.dark-mode .routine-tag { background: #332b1a; color: #f39c12; }
        body.dark-mode .badge-tag { background: #332b1a; color: #f39c12; }
        body.dark-mode .encyclopedia-box { background: #1c3626; color: #2ecc71; }

        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: #e1e5eb; font-family: 'Nunito', sans-serif; 
            overflow: hidden; display: flex; justify-content: center; color: var(--text-color); 
        }

        #app-interface, #auth-screen { 
            width: 100%; max-width: 480px; height: 100%; 
            background: var(--bg-color); position: relative; 
            overflow: hidden; display: flex; flex-direction: column; transition: background 0.3s;
        }

        .modal { position: fixed; inset: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(3px); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .card { background: var(--panel-bg); width: 100%; max-width: 380px; border-radius: 28px; padding: 30px; text-align: center; position: relative; box-shadow: var(--soft-shadow); border: none; max-height: 85vh; overflow-y: auto; display:flex; flex-direction:column; transition: background 0.3s;}
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: var(--bg-color); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--text-color); z-index: 10; display: flex; align-items: center; justify-content: center; transition: 0.3s; }

        #toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--text-color); color: var(--bg-color); padding: 12px 24px; border-radius: 50px; z-index: 25000; display: none; font-weight: 800; font-size: 14px; box-shadow: var(--soft-shadow); text-align: center; }

        .bottom-nav { 
            min-height: var(--nav-height); flex-shrink: 0; 
            background: var(--panel-bg); display: flex; 
            justify-content: space-around; align-items: center; 
            z-index: 15000; padding-bottom: env(safe-area-inset-bottom); 
            box-sizing: border-box; box-shadow: 0 -10px 20px rgba(0,0,0,0.03); 
            border-radius: 30px 30px 0 0; transition: background 0.3s;
        }
        
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; flex: 1; border: none; background: none; outline: none; padding: 10px 0;}
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 11px; font-weight: 800; transition: color 0.3s; }
        .blinking-nav span { animation: pulse-text 1.2s infinite; color: var(--danger); }

        .view-section { flex: 1; width: 100%; display: none; overflow-x: hidden; overflow-y: auto; box-sizing: border-box; background: var(--bg-color); position: relative; min-height: 0; }
        .view-section.active { display: block; }

        #map { top: 0; left: 0; right: 0; bottom: 0; position: absolute; z-index: 1; }
        #ctrl-panel { position: absolute; top: 15px; left: 15px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .map-ctrl-btn { background: var(--panel-bg); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; color: var(--text-color); font-size: 18px; cursor: pointer; box-shadow: var(--soft-shadow); font-weight: 900; transition: 0.3s; }
        
        .btn-main { background: var(--primary); color: white; border: none; font-weight: 800; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 15px rgba(255, 82, 82, 0.2); transition: 0.2s; font-size: 13px; letter-spacing: 0.5px; flex-shrink: 0;}
        .btn-outline { background: transparent; color: var(--text-color); border: 2px solid var(--border-color); font-weight: 800; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 13px; margin-top: 10px; transition: 0.2s; flex-shrink: 0;}
        
        input, select, textarea { width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-weight: 600; margin-bottom: 12px; box-sizing: border-box; outline: none; transition: 0.3s; }
        
        .post-card { background: var(--panel-bg); margin: 15px; border-radius: 24px; padding: 20px; box-shadow: var(--soft-shadow); position:relative; overflow: hidden; transition: 0.3s;}
        .badge-tag { padding: 6px 12px; border-radius: 50px; font-size: 11px; font-weight: 800; margin: 5px 3px; display: inline-block; }
        .routine-tag { padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 800; display: inline-block; margin-top: 8px; text-transform: uppercase; }
        .encyclopedia-box { padding: 15px; border-radius: 16px; font-size: 13px; font-weight: 700; text-align: left; margin-top: 12px; background: #e8f5e9; color: #2e7d32; }

        .tab-btn { flex: 1; padding: 12px; font-weight: 900; border: none; border-radius: 12px; background: transparent; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--panel-bg); color: var(--text-color); box-shadow: var(--soft-shadow); }
        .tab-container { background: var(--border-color); border-radius: 16px; padding: 5px; display: flex; gap: 5px; margin-bottom: 15px; }
    </style></head><body>

    <div id="loader" style="position:fixed; inset:0; z-index:30000; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:32px;">Waggle🐾</div>
    <div id="toast">Sukces!</div>

    <div id="auth-screen" style="display:none; flex-direction:column; justify-content:center; padding:30px;">
        <h1 style="font-size: 50px; margin: 0; text-align:center; color:var(--primary); font-weight:900;">Waggle.</h1>
        <p style="text-align:center; margin-bottom:25px; font-weight:800; color:var(--text-muted);" data-i18n="auth_subtitle">Dołącz do stada! 🐕</p>
        <input type="email" id="authEmail" placeholder="E-mail">
        <input type="password" id="authPass" placeholder="Hasło">
        <button class="btn-main" onclick="handleLogin()" data-i18n="btn_login">ZALOGUJ SIĘ</button>
        <button class="btn-outline" onclick="handleRegister()" data-i18n="btn_register">REJESTRACJA</button>
    </div>

    <div id="app-interface" style="display:none;">
        <section id="view-map" class="view-section active">
            <div id="ctrl-panel">
                <button class="map-ctrl-btn" onclick="centerOnMe()">🎯</button>
            </div>
            <div id="map"></div>
        </section>

        <section id="view-wiki" class="view-section">
            <div style="padding:20px; background:var(--bg-color); position: sticky; top:0; z-index:100;">
                <div class="tab-container">
                    <button id="tab-breeds" class="tab-btn active" onclick="toggleWikiTab('breeds')" data-i18n="tab_breeds">RASY</button>
                    <button id="tab-training" class="tab-btn" onclick="toggleWikiTab('training')" data-i18n="tab_training">TRENING</button>
                </div>
            </div>
            <div id="wiki-breeds-container" style="padding:0 15px 20px;">
                <div style="text-align:center; padding:20px; color:var(--text-muted);">🐾 Węszę w bazie wiedzy...</div>
            </div>
            <div id="wiki-training-container" style="display:none; padding:0 15px 20px;"></div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchView('map', this)"><span data-i18n="nav_map">📍 Mapa</span></button>
            <button class="nav-item" onclick="switchView('wiki', this)"><span data-i18n="nav_wiki">📘 Wiedza</span></button>
            <button class="nav-item" onclick="switchView('profile', this)"><span data-i18n="nav_profile">👤 Profil</span></button>
        </nav>
    </div>

    <!-- Modale (Uproszczone dla czytelności) -->
    <div id="user-profile-modal" class="modal"><div class="card"><button class="close-modal-btn" onclick="this.parentElement.parentElement.style.display='none'">✕</button><h2 id="cardName"></h2><div id="cardEncyclopedia" class="encyclopedia-box" style="display:none;"><b>🧠 Wiedza o rasie:</b> <br><span id="cardEncyclopediaText"></span></div></div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA7CSlyOLzbz2LpO0C-KqaZQ0U_OrNqBcg", authDomain: "waggle-app-31ffa.firebaseapp.com", projectId: "waggle-app-31ffa", storageBucket: "waggle-app-31ffa.firebasestorage.app", messagingSenderId: "711707392068", appId: "1:711707392068:web:b81c7e0714cfe24dd1e411" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); const auth = firebase.auth();

        let currentLang = 'pl';
        let currentUserUid, map;

        // --- DYNAMIKA WIKI ---

        async function seedWikiIfNeeded() {
            const snap = await db.collection("wiki_breeds").limit(1).get();
            if (snap.empty) {
                console.log("🛠️ Inicjalizacja bazy Wiki...");
                const breeds = [
                    { name: "Golden Retriever", desc_pl: "Inteligentne, łagodne i chętne do nauki. Uwielbiają wodę i aportowanie.", desc_en: "Intelligent, gentle and eager to learn. They love water and retrieving.", tags_pl: ["✅ Łatwy", "⚡ Duża energia"], tags_en: ["✅ Easy", "⚡ High energy"] },
                    { name: "Border Collie", desc_pl: "Wulkan energii. Potrzebują bardzo dużo pracy umysłowej i ruchu.", desc_en: "Energy volcano. They need a lot of mental work and exercise.", tags_pl: ["❌ Wymagający", "⚡⚡ Max energia"], tags_en: ["❌ Demanding", "⚡⚡ Max energy"] },
                    { name: "Mops (Pug)", desc_pl: "Wesołe kanapowce. Bardzo przywiązane do właściciela, źle znoszą upały.", desc_en: "Happy couch potatoes. Very attached to owners, sensitive to heat.", tags_pl: ["✅ Łatwy", "🛋️ Mało ruchu"], tags_en: ["✅ Easy", "🛋️ Low exercise"] }
                ];
                const tips = [
                    { title_pl: "Metoda Drzewa", title_en: "Tree Method", desc_pl: "Jeśli pies ciągnie, zatrzymaj się. Rusz dopiero, gdy smycz się poluzuje.", desc_en: "If the dog pulls, stop. Move only when the leash goes slack." }
                ];
                for (let b of breeds) await db.collection("wiki_breeds").add(b);
                for (let t of tips) await db.collection("wiki_tips").add(t);
            }
            loadWikiData();
        }

        function loadWikiData() {
            // Rasy
            db.collection("wiki_breeds").orderBy("name").onSnapshot(snap => {
                const cont = document.getElementById('wiki-breeds-container');
                cont.innerHTML = "";
                snap.forEach(doc => {
                    const b = doc.data();
                    const desc = currentLang === 'pl' ? b.desc_pl : b.desc_en;
                    const tags = currentLang === 'pl' ? b.tags_pl : b.tags_en;
                    let tagsH = tags.map(t => `<span class="badge-tag" style="background:var(--secondary);color:white;">${t}</span>`).join('');
                    cont.innerHTML += `<div class="post-card"><h3>${b.name}</h3>${tagsH}<p style="font-size:14px;color:var(--text-muted);">${desc}</p></div>`;
                });
            });
            // Porady
            db.collection("wiki_tips").onSnapshot(snap => {
                const cont = document.getElementById('wiki-training-container');
                cont.innerHTML = "";
                snap.forEach(doc => {
                    const t = doc.data();
                    const title = currentLang === 'pl' ? t.title_pl : t.title_en;
                    const desc = currentLang === 'pl' ? t.desc_pl : t.desc_en;
                    cont.innerHTML += `<div class="post-card"><div class="post-tag" style="background:var(--gold);color:white;padding:4px 8px;border-radius:8px;font-size:10px;display:inline-block;margin-bottom:10px;">PORADA</div><h3>${title}</h3><p style="font-size:14px;color:var(--text-muted);">${desc}</p></div>`;
                });
            });
        }

        async function getBreedEncyclopedia(breedName) {
            const snap = await db.collection("wiki_breeds").where("name", "==", breedName).get();
            if (snap.empty) return null;
            const data = snap.docs[0].data();
            return currentLang === 'pl' ? data.desc_pl : data.desc_en;
        }

        // --- LOGIKA APKI ---

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserUid = user.uid;
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app-interface').style.display = 'flex';
                document.getElementById('auth-screen').style.display = 'none';
                initMap();
                seedWikiIfNeeded(); // <--- To załatwia sprawę bazy
            } else {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([52.2297, 21.0122], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
        }

        async function openUserCard(uid) {
            const doc = await db.collection("users").doc(uid).get();
            if(!doc.exists) return;
            const d = doc.data();
            document.getElementById('cardName').innerText = d.name;
            
            // Pobieranie wiedzy z bazy dynamicznej
            const enc = await getBreedEncyclopedia(d.breed);
            if (enc) {
                document.getElementById('cardEncyclopediaText').innerText = enc;
                document.getElementById('cardEncyclopedia').style.display = 'block';
            } else {
                document.getElementById('cardEncyclopedia').style.display = 'none';
            }
            document.getElementById('user-profile-modal').style.display = 'flex';
        }

        function switchView(v, el) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            if(v === 'map' && map) setTimeout(() => map.invalidateSize(), 200);
        }

        function toggleWikiTab(t) {
            document.getElementById('tab-breeds').classList.toggle('active', t==='breeds');
            document.getElementById('tab-training').classList.toggle('active', t==='training');
            document.getElementById('wiki-breeds-container').style.display = t==='breeds'?'block':'none';
            document.getElementById('wiki-training-container').style.display = t==='training'?'block':'none';
        }

        function handleLogin() { auth.signInWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPass').value).catch(e => alert(e.message)); }
        function handleRegister() { auth.createUserWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPass').value).catch(e => alert(e.message)); }
    </script>
</body></html>
