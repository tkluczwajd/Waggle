<!DOCTYPE html><html lang="pl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA & Mobile Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff5252">

    <title>Waggle v21.28 🐾 Full Production</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #ff5252; --secondary: #34ace0; --bg-color: #f4f6f8; 
            --panel-bg: #ffffff; --text-color: #2c3e50; --border-color: #f1f2f6;
            --text-muted: #a4b0be; --danger: #ff5252; --gold: #ffb142;
            --nav-height: 75px; --soft-shadow: 0 10px 25px rgba(149, 157, 165, 0.15);
        }
        
        body { margin: 0; padding: 0; height: 100vh; width: 100vw; background: #e1e5eb; font-family: 'Nunito', sans-serif; overflow: hidden; display: flex; justify-content: center; color: var(--text-color); }
        #app-interface, #auth-screen { width: 100%; max-width: 480px; height: 100%; background: var(--bg-color); position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* Loader & Modals */
        .modal { position: fixed; inset: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(3px); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .card { background: var(--panel-bg); width: 100%; max-width: 380px; border-radius: 28px; padding: 30px; text-align: center; position: relative; box-shadow: var(--soft-shadow); max-height: 85vh; overflow-y: auto; }
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: var(--bg-color); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }

        /* Nav & Views */
        .bottom-nav { height: var(--nav-height); background: var(--panel-bg); display: flex; justify-content: space-around; align-items: center; z-index: 15000; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -10px 20px rgba(0,0,0,0.03); border-radius: 30px 30px 0 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; flex: 1; border: none; background: none; font-size: 11px; font-weight: 800; }
        .nav-item.active { color: var(--primary); }
        
        .view-section { flex: 1; width: 100%; display: none; overflow-y: auto; background: var(--bg-color); position: relative; }
        .view-section.active { display: block; }

        /* Map Elements */
        #map { top: 0; left: 0; right: 0; bottom: 0; position: absolute; z-index: 1; }
        .sos-btn { position: absolute; top: 20px; left: 20px; z-index: 10000; background: var(--danger); color: white; border: 4px solid white; border-radius: 50%; width: 55px; height: 55px; font-weight: 900; box-shadow: var(--soft-shadow); }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .sos-pulse { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--danger); border-radius: 50%; z-index: -1; animation: pulse 2s infinite; }

        /* Post & List Items */
        .post-card { background: var(--panel-bg); margin: 15px; border-radius: 24px; padding: 20px; box-shadow: var(--soft-shadow); }
        .btn-main { background: var(--primary); color: white; border: none; font-weight: 800; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 14px; border-radius: 16px; border: 2px solid var(--border-color); background: var(--bg-color); margin-bottom: 12px; box-sizing: border-box; font-family: inherit; }
        
        .badge-tag { padding: 4px 10px; border-radius: 50px; font-size: 10px; font-weight: 800; background: var(--secondary); color: white; margin-right: 5px; }
    </style>
</head><body>

    <div id="loader" style="position:fixed; inset:0; z-index:30000; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:32px;">Waggle🐾</div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" style="display:none; justify-content:center; padding:30px;">
        <h1 style="text-align:center; color:var(--primary); font-size:45px; font-weight:900;">Waggle.</h1>
        <input type="email" id="authEmail" placeholder="E-mail">
        <input type="password" id="authPass" placeholder="Hasło">
        <button class="btn-main" onclick="handleLogin()">ZALOGUJ SIĘ</button>
        <button class="btn-main" style="background:var(--text-color)" onclick="handleRegister()">DOŁĄCZ DO STADA</button>
    </div>

    <!-- MAIN APP -->
    <div id="app-interface" style="display:none;">
        
        <section id="view-map" class="view-section active">
            <button class="sos-btn" onclick="triggerSOS()"><div class="sos-pulse"></div>SOS</button>
            <div id="map"></div>
            <div id="walk-setup-panel" style="position:absolute; bottom:15px; left:5%; width:90%; z-index:1000; background:white; padding:15px; border-radius:24px; box-shadow:var(--soft-shadow); box-sizing:border-box;">
                <input type="text" id="statusInput" placeholder="Co u Was?" style="margin-bottom:8px;">
                <button class="btn-main" id="startBtn" onclick="startWalk()">ROZPOCZNIJ SPACER 🐾</button>
                <button class="btn-main" id="stopBtn" onclick="stopWalk()" style="display:none; background:var(--text-color)">ZAKOŃCZ 🏁</button>
            </div>
        </section>

        <section id="view-community" class="view-section">
            <div style="padding:20px;"><h3 style="font-weight:900; font-size:24px;">Tablica stada</h3></div>
            <div id="posts-container"></div>
            <button class="btn-main" style="position:fixed; bottom:90px; right:20px; width:60px; height:60px; border-radius:50%; font-size:24px; z-index:1000;" onclick="document.getElementById('post-modal').style.display='flex'">+</button>
        </section>

        <section id="view-wiki" class="view-section">
            <div style="padding:20px;"><h3 style="font-weight:900; font-size:24px;">Encyklopedia</h3></div>
            <div id="wiki-container"></div>
        </section>

        <section id="view-chat" class="view-section">
            <div style="padding:20px;"><h3 style="font-weight:900; font-size:24px;">Czat</h3></div>
            <div id="chat-list"></div>
        </section>

        <section id="view-profile" class="view-section">
            <div style="padding:40px 20px; text-align:center;">
                <div id="p-avatar" style="width:120px; height:120px; border-radius:50%; background:#ddd; margin:0 auto 15px; overflow:hidden; border:5px solid white; box-shadow:var(--soft-shadow);"></div>
                <h2 id="p-name" style="margin:0; font-weight:900;">Ładowanie...</h2>
                <p id="p-breed" style="color:var(--text-muted); font-weight:800;"></p>
                <button class="btn-main" onclick="handleLogout()" style="background:var(--border-color); color:var(--text-color)">WYLOGUJ</button>
            </div>
        </section>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchView('map', this)">📍 Mapa</div>
            <div class="nav-item" onclick="switchView('community', this)">📱 Tablica</div>
            <div class="nav-item" onclick="switchView('wiki', this)">📘 Wiki</div>
            <div class="nav-item" onclick="switchView('chat', this)">💬 Czat</div>
            <div class="nav-item" onclick="switchView('profile', this)">👤 Profil</div>
        </nav>
    </div>

    <!-- MODAL POST -->
    <div id="post-modal" class="modal"><div class="card">
        <button class="close-modal-btn" onclick="this.parentElement.parentElement.style.display='none'">✕</button>
        <h3 style="font-weight:900;">Nowy wpis</h3>
        <textarea id="postContent" placeholder="Napisz coś do okolicy..."></textarea>
        <button class="btn-main" onclick="savePost()">OPUBLIKUJ</button>
    </div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA7CSlyOLzbz2LpO0C-KqaZQ0U_OrNqBcg", authDomain: "waggle-app-31ffa.firebaseapp.com", projectId: "waggle-app-31ffa", storageBucket: "waggle-app-31ffa.firebasestorage.app", messagingSenderId: "711707392068", appId: "1:711707392068:web:b81c7e0714cfe24dd1e411" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); const auth = firebase.auth();

        let map, userUid, myLat, myLng, isWalking = false, myMarker;
        let lastLoggedLat, lastLoggedLng;

        auth.onAuthStateChanged(user => {
            document.getElementById('loader').style.display = 'none';
            if (user) {
                userUid = user.uid;
                document.getElementById('app-interface').style.display = 'flex';
                initApp();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        function initApp() {
            initMap();
            loadWiki();
            loadPosts();
            db.collection("users").doc(userUid).onSnapshot(doc => {
                if(doc.exists) {
                    const d = doc.data();
                    document.getElementById('p-name').innerText = d.name || "Piesek";
                    document.getElementById('p-breed').innerText = d.breed || "Rasa nieustalona";
                    if(d.avatar) document.getElementById('p-avatar').innerHTML = `<img src="${d.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
                }
            });
        }

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([52.2297, 21.0122], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

            navigator.geolocation.watchPosition(pos => {
                myLat = pos.coords.latitude; myLng = pos.coords.longitude;
                if(!myMarker) {
                    myMarker = L.circleMarker([myLat, myLng], { radius: 10, color: '#fff', fillColor: '#34ace0', fillOpacity: 1, weight: 3 }).addTo(map);
                    map.setView([myLat, myLng], 15);
                } else { myMarker.setLatLng([myLat, myLng]); }

                if(isWalking) {
                    const dist = lastLoggedLat ? getDist(lastLoggedLat, lastLoggedLng, myLat, myLng) : 999;
                    if(dist > 0.01) { // 10 metrów dławik
                        db.collection("walks").doc(userUid).set({ lat: myLat, lng: myLng, time: Date.now() }, {merge:true});
                        lastLoggedLat = myLat; lastLoggedLng = myLng;
                    }
                }
            }, null, { enableHighAccuracy: true });
        }

        function getDist(lat1, lon1, lat2, lon2) { const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180; const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); }

        function triggerSOS() {
            const phone = prompt("🚨 Podaj numer telefonu do kontaktu SOS:");
            if(phone) {
                db.collection("emergency_alerts").add({ lat: myLat, lng: myLng, contact: phone, status: "active", time: Date.now(), userId: userUid });
                alert("Sygnał SOS został wysłany do wszystkich w okolicy!");
            }
        }

        function startWalk() { isWalking = true; document.getElementById('startBtn').style.display='none'; document.getElementById('stopBtn').style.display='block'; }
        function stopWalk() { isWalking = false; db.collection("walks").doc(userUid).delete(); location.reload(); }

        function loadWiki() {
            db.collection("wiki_breeds").onSnapshot(snap => {
                let h = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    h += `<div class="post-card"><h4>${d.name}</h4><p style="font-size:13px; color:var(--text-muted)">${d.desc_pl}</p></div>`;
                });
                document.getElementById('wiki-container').innerHTML = h;
            });
        }

        function loadPosts() {
            db.collection("posts").orderBy("time", "desc").limit(20).onSnapshot(snap => {
                let h = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    h += `<div class="post-card"><b style="color:var(--primary)">${d.author || 'Anonim'}</b><p style="margin:5px 0;">${d.content}</p></div>`;
                });
                document.getElementById('posts-container').innerHTML = h;
            });
        }

        function savePost() {
            const c = document.getElementById('postContent').value; if(!c) return;
            db.collection("posts").add({ content: c, time: Date.now(), author: userUid });
            document.getElementById('post-modal').style.display = 'none';
        }

        function switchView(v, el) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            if(v==='map') setTimeout(()=>map.invalidateSize(), 200);
        }

        function handleLogin() { auth.signInWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPass').value).catch(e => alert(e.message)); }
        function handleRegister() { auth.createUserWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPass').value).catch(e => alert(e.message)); }
        function handleLogout() { auth.signOut().then(() => location.reload()); }
    </script>
</body></html>
