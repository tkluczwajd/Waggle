<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Waggle 🐾 Premium UI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader">Waggle🐾</div>
    <div id="toast"></div>

    <div id="lightbox-modal" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <!-- EKRAN LOGOWANIA -->
    <div id="auth-screen" class="screen-container">
        <div class="auth-content">
            <h1 class="logo-title">Waggle.</h1>
            <p style="margin-bottom: 30px; font-size: 18px; color: var(--text-color);">Dołącz do stada! 🐕</p>
            <input type="email" id="authEmail" placeholder="E-mail">
            <input type="password" id="authPass" placeholder="Hasło">
            <div style="margin-top: 20px;">
                <button class="btn-main" id="loginBtn">ZALOGUJ SIĘ</button>
                <button class="btn-outline" id="registerBtn">REJESTRACJA</button>
            </div>
            <div class="legal-checkbox-container" style="margin-top:20px; justify-content:center;">
                <input type="checkbox" id="legalTerms">
                <label for="legalTerms">Akceptuję Regulamin Waggle.</label>
            </div>
        </div>
    </div>

    <!-- INTERFEJS APLIKACJI -->
    <div id="app-interface" class="screen-container">
        
        <!-- WIDOK: MAPA -->
        <section id="view-map" class="view-section active">
            <div id="map-ui-layer">
                <div id="top-widgets">
                    <!-- Dodano ID dla pogody, żeby łatwiej wyłapać kliknięcie -->
                    <div class="top-pill" id="weatherWidgetBtn" style="cursor:pointer;">☀️ <span id="weather-temp">--°C</span></div>
                    <div id="active-alert-pill" class="top-pill" style="display:none; background:var(--danger); color:white;">⚠️ Alerty!</div>
                </div>
                <div id="ctrl-panel">
                    <button class="map-ctrl-btn" id="centerBtn">🎯</button>
                    <!-- Przycisk alertu -->
                    <button class="map-ctrl-btn danger" id="triggerAlertBtn">⚠️</button>
                </div>
                <div id="walk-setup-panel">
                    <input type="text" id="statusInput" placeholder="Co u Was?" style="margin-bottom: 10px;">
                    <button class="btn-main" id="startWalkBtn">WYJDŹ NA SPACER 🐾</button>
                    <button class="btn-main" id="stopWalkBtn" style="display:none; background:var(--text-color);">ZAKOŃCZ 🏁</button>
                </div>
            </div>
            <div id="map"></div>
        </section>

        <!-- WIDOK: TABLICA -->
        <section id="view-community" class="view-section">
            <div class="sticky-header">
                <h3 style="margin:0;">W okolicy</h3>
                <div id="stories-container"></div>
                <button class="btn-main" id="addPostBtn" style="margin-top:15px; padding: 12px;">➕ DODAJ POSTA</button>
            </div>
            <div id="posts-container"></div>
        </section>

        <!-- WIDOK: WIEDZA -->
        <section id="view-wiki" class="view-section">
            <div class="sticky-header" style="padding-bottom: 0;">
                <h3 style="margin:0 0 15px 0;">Psia Wiedza</h3>
                <div class="wiki-tabs">
                    <button class="wiki-tab-btn active" data-tab="rasy">Rasy Psów</button>
                    <button class="wiki-tab-btn" data-tab="trening">Szkolenie</button>
                    <button class="wiki-tab-btn" data-tab="sytuacje">Sytuacje</button>
                </div>
            </div>
            <div id="wiki-content" style="padding-top: 10px;"></div>
        </section>

        <!-- WIDOK: CZAT -->
        <section id="view-chat" class="view-section">
            <div class="sticky-header">
                <h3 style="margin:0;">Wiadomości</h3>
            </div>
            <div id="inbox-container"></div>
            
            <div id="chat-window" class="chat-overlay">
                <div class="chat-header">
                    <button id="closeChatBtn" class="icon-btn">⬅️</button>
                    <b id="chatPartnerName" style="font-size: 18px;">Czat</b>
                </div>
                <div id="chatMessages"></div>
                <div class="chat-footer">
                    <input type="text" id="chatInput" placeholder="Napisz wiadomość...">
                    <button id="sendMsgBtn" class="btn-main" style="width: auto; padding: 0 20px;">Wyślij</button>
                </div>
            </div>
        </section>

        <!-- WIDOK: PROFIL -->
        <section id="view-profile" class="view-section">
            <div class="profile-header">
                <img id="profileAvatar" src="" style="width:120px; height:120px; border-radius:50%; border:4px solid white; box-shadow:var(--soft-shadow); object-fit:cover;">
                <h2 id="profileNameDisplay" style="margin: 15px 0 5px 0;">...</h2>
                <div class="stats-bar">
                    <div><b id="statWalks" class="stat-num" style="color: var(--primary);">0</b><br><small>Spacerów</small></div>
                    <div><b id="statDist" class="stat-num" style="color: var(--secondary);">0.0</b><br><small>KM</small></div>
                </div>
                
                <div class="profile-actions" style="margin-top: 25px; display: flex; flex-direction: column; gap: 15px; padding: 0 20px;">
                    <button class="btn-main" id="openEditProfileBtn" style="background: var(--secondary);">✏️ EDYTUJ PROFIL</button>
                    <button class="btn-main" id="openSettingsBtn" style="background: #576574;">⚙️ USTAWIENIA</button>
                    <button class="btn-outline" id="logoutBtn" style="color: var(--danger); border-color: var(--danger);">WYLOGUJ SIĘ</button>
                </div>
            </div>
        </section>

        <nav class="bottom-nav">
            <div class="nav-item active" data-view="map">📍<span>Mapa</span></div>
            <div class="nav-item" data-view="community">📱<span>Tablica</span></div>
            <div class="nav-item" data-view="wiki">📘<span>Wiedza</span></div>
            <div class="nav-item" data-view="chat">💬<span>Czat</span></div>
            <div class="nav-item" data-view="profile">👤<span>Profil</span></div>
        </nav>
    </div>

    <!-- MODAL: EDYCJA PROFILU -->
    <div id="profile-setup-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="font-weight:900; font-size:24px; margin-top:0;">Profil Psa</h3>
            <input type="text" id="setupName" placeholder="Imię psa">
            <input type="text" id="setupCity" placeholder="Miasto">
            <input type="text" id="setupBreed" placeholder="Rasa">
            <select id="setupRoutine">
                <option value="brak">Kiedy zwykle spacerujecie?</option>
                <option value="Rano">Rano 🌅</option>
                <option value="Popołudniu">Popołudniu ☀️</option>
                <option value="Wieczorem">Wieczorem 🌙</option>
            </select>
            <button class="btn-main" id="saveProfileBtn">ZAPISZ</button>
        </div>
    </div>

    <!-- MODAL: USTAWIENIA (UZUPEŁNIONE O WIDOCZNOŚĆ) -->
    <div id="settings-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="font-weight:900; margin-top:0;">Ustawienia</h3>
            
            <div style="text-align:left; margin-bottom:15px;">
                <label style="font-size:12px; font-weight:800; color:var(--text-muted);">Wygląd</label>
                <select id="settingTheme">
                    <option value="light">☀️ Jasny</option>
                    <option value="dark">🌙 Ciemny</option>
                </select>
            </div>
            
            <div style="text-align:left; margin-bottom:20px;">
                <label style="font-size:12px; font-weight:800; color:var(--text-muted);">Wielkość tekstu</label>
                <select id="settingFontSize">
                    <option value="14px">Mała (Domyślna)</option>
                    <option value="16px">Średnia</option>
                    <option value="18px">Duża</option>
                </select>
            </div>

            <!-- CHECKBOX PRYWATNOŚCI -->
            <div style="display:flex; align-items:flex-start; gap:10px; margin-bottom:20px; text-align:left;">
                <input type="checkbox" id="settingSearchable" style="width:20px; height:20px; margin:0;">
                <label style="font-size:13px; font-weight:700; color:var(--text-color);">Chcę być widoczny na mapie i w wynikach wyszukiwania dla innych psów.</label>
            </div>

            <button class="btn-main" id="saveSettingsBtn">ZAPISZ USTAWIENIA</button>
        </div>
    </div>

    <!-- MODAL: POGODA (3 DNI) -->
    <div id="weather-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="font-weight:900; margin-top:0;">Prognoza Pogody ⛅</h3>
            <div id="weather-forecast-content" style="text-align:left;">Ładowanie pogody...</div>
        </div>
    </div>

    <!-- MODAL: DODAWANIE ALERTU -->
    <div id="alert-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3 style="color:var(--danger); font-weight:900; margin-top:0;">⚠️ Zgłoś Zagrożenie</h3>
            <p style="font-size:13px; margin-top:0;">Zaznacz na mapie szkło, trutkę lub agresywnego psa.</p>
            <input type="text" id="alertTextInput" placeholder="Co się stało? (np. Szkło)">
            <button class="btn-main" id="saveAlertBtn" style="background:var(--danger);">POSTAW ZNACZNIK</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script type="module" src="src/app.js"></script>
</body>
</html>
