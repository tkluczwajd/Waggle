<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f4f6f8">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1068/1068827.png">

    <title>Waggle v21.15 🐾 Smart Text Wrapping</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #ff5252; --secondary: #34ace0; --bg-color: #f4f6f8; 
            --panel-bg: #ffffff; --text-color: #2c3e50; --border-color: #f1f2f6;
            --text-muted: #a4b0be;
            --male: #34ace0; --female: #ff5252; --gold: #ffb142; --danger: #ff5252;
            --nav-height: 75px; 
            --soft-shadow: 0 10px 25px rgba(149, 157, 165, 0.15);
        }
        
        body.dark-mode { 
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #e0e0e0; 
            --border-color: #333333; --text-muted: #888888;
        }
        body.dark-mode #map { filter: brightness(0.8) contrast(1.1); } 
        body.dark-mode .alert-item { background: #3d1c1c; }
        body.dark-mode .routine-tag { background: #332b1a; color: #f39c12; }
        body.dark-mode .badge-tag { background: #332b1a; color: #f39c12; }
        body.dark-mode .encyclopedia-box { background: #1c3626; color: #2ecc71; }

        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: #e1e5eb; font-family: 'Nunito', sans-serif; 
            overflow: hidden; display: flex; justify-content: center; color: var(--text-color); 
        }

        #app-interface, #auth-screen { 
            width: 100%; max-width: 480px; height: 100%; 
            background: var(--bg-color); position: relative; 
            overflow: hidden; display: flex; flex-direction: column; transition: background 0.3s;
        }

        .modal { position: fixed; inset: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(3px); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .card { background: var(--panel-bg); width: 100%; max-width: 380px; border-radius: 28px; padding: 30px; text-align: center; position: relative; box-shadow: var(--soft-shadow); border: none; max-height: 85vh; overflow-y: auto; display:flex; flex-direction:column; transition: background 0.3s;}
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: var(--bg-color); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--text-color); z-index: 10; display: flex; align-items: center; justify-content: center; transition: 0.3s; }

        #toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); background: var(--text-color); color: var(--bg-color); padding: 12px 24px; border-radius: 50px; z-index: 25000; display: none; font-weight: 800; font-size: 14px; box-shadow: var(--soft-shadow); text-align: center; }

        .bottom-nav { 
            min-height: var(--nav-height); flex-shrink: 0; 
            background: var(--panel-bg); display: flex; 
            justify-content: space-around; align-items: center; 
            z-index: 15000; padding-bottom: env(safe-area-inset-bottom); 
            box-sizing: border-box; box-shadow: 0 -10px 20px rgba(0,0,0,0.03); 
            border-radius: 30px 30px 0 0; transition: background 0.3s;
        }
        
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; flex: 1; border: none; background: none; outline: none; padding: 10px 0;}
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 11px; font-weight: 800; transition: color 0.3s; }

        .view-section { flex: 1; width: 100%; display: none; overflow-x: hidden; overflow-y: auto; box-sizing: border-box; background: var(--bg-color); position: relative; min-height: 0; }
        .view-section.active { display: block; }

        #map { top: 0; left: 0; right: 0; bottom: 0; position: absolute; z-index: 1; }
        #ctrl-panel { position: absolute; top: 15px; left: 15px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .map-ctrl-btn { background: var(--panel-bg); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; color: var(--text-color); font-size: 18px; cursor: pointer; box-shadow: var(--soft-shadow); font-weight: 900; transition: 0.3s; }
        
        #top-widgets { position: absolute; top: 15px; right: 15px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .top-pill { background: var(--panel-bg); padding: 10px 18px; border-radius: 50px; font-size: 13px; font-weight: 800; border: none; box-shadow: var(--soft-shadow); cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-color); transition: 0.3s;}
        
        .danger-pill { background: var(--danger) !important; color: white !important; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #walk-setup-panel { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; z-index: 5000; background: var(--panel-bg); border-radius: 28px; padding: 18px; border: none; box-shadow: var(--soft-shadow); box-sizing: border-box; transition: 0.3s;}
        
        /* POPRAWKA ZAWINIĘCIA TEKSTU */
        .post-card { background: var(--panel-bg); margin: 15px; border-radius: 24px; padding: 20px; box-shadow: var(--soft-shadow); position:relative; overflow: hidden; transition: 0.3s;}
        .post-card p, .post-card b, .comment-item div { 
            word-break: normal; 
            overflow-wrap: break-word; 
            white-space: pre-wrap; 
            max-width: 100%; 
            margin-top:8px; 
            display:block;
            text-align: left;
        }
        
        .delete-btn { position:absolute; top:15px; right:15px; background:none; border:none; font-size:16px; cursor:pointer; opacity:0.6; padding:5px;}

        .btn-main { background: var(--primary); color: white; border: none; font-weight: 800; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 15px rgba(255, 82, 82, 0.2); transition: 0.2s; font-size: 13px; letter-spacing: 0.5px; flex-shrink: 0;}
        .btn-outline { background: transparent; color: var(--text-color); border: 2px solid var(--border-color); font-weight: 800; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 13px; transition: 0.2s; flex-shrink: 0;}
        
        input, select, textarea { width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-weight: 600; margin-bottom: 12px; box-sizing: border-box; outline: none; transition: 0.3s; flex-shrink: 0;}

        .walk-card { background: var(--panel-bg); border-radius: 20px; padding: 10px; min-width: 80px; text-align: center; box-shadow: var(--soft-shadow); border: none; flex-shrink: 0; cursor: pointer; transition: 0.3s;}
        .walk-card img { 
            width: 45px; height: 45px; min-width: 45px; min-height: 45px; 
            aspect-ratio: 1/1; border-radius: 50%; object-fit: cover; 
            background: var(--bg-color); flex-shrink: 0; box-sizing: border-box;
        }
        
        #stories-container { display: flex; gap: 15px; overflow-x: auto; padding: 10px 15px 15px 15px; margin: 0 -15px; scrollbar-width: none; }

        .encyclopedia-box { padding: 15px; border-radius: 16px; font-size: 13px; font-weight: 700; text-align: left; margin-top: 12px; overflow-wrap: break-word; }
        .badge-tag { padding: 6px 12px; border-radius: 50px; font-size: 11px; font-weight: 800; margin: 5px 3px; display: inline-block; }

        .filter-btn { padding: 8px 18px; border-radius: 50px; font-size: 12px; font-weight: 800; border: none; background: var(--border-color); color: var(--text-color); cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .filter-btn.active { background: var(--text-color); color: var(--bg-color); }
        .post-tag { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; background: var(--border-color); margin-bottom: 10px; display: inline-block; color: var(--text-color); }
        
        .tab-btn { flex: 1; padding: 12px; font-weight: 900; border: none; border-radius: 12px; background: transparent; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--panel-bg); color: var(--text-color); box-shadow: var(--soft-shadow); }
        .tab-container { background: var(--border-color); border-radius: 16px; padding: 5px; display: flex; gap: 5px; margin-bottom: 15px; transition: 0.3s;}
    </style>
</head>
<body>

    <div id="loader" style="position:fixed; inset:0; z-index:30000; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:32px;">Waggle🐾</div>
    <div id="toast">Sukces!</div>

    <div id="lightbox-modal" onclick="this.style.display='none'">
        <button class="lightbox-close">✕</button>
        <img id="lightbox-img" src="">
    </div>

    <div id="auth-screen" style="display:none; flex-direction:column; justify-content:center; padding:30px;">
        <h1 style="font-size: 50px; margin: 0; text-align:center; color:var(--primary); font-weight:900;">Waggle.</h1>
        <p style="text-align:center; margin-bottom:25px; font-weight:800; color:var(--text-muted);" data-i18n="auth_subtitle">Dołącz do stada! 🐕</p>
        <input type="email" id="authEmail" placeholder="E-mail">
        <input type="password" id="authPass" placeholder="Hasło" onkeypress="if(event.key === 'Enter') handleLogin()" data-i18n="auth_pass">
        <button class="btn-main" onclick="handleLogin()" data-i18n="btn_login">ZALOGUJ SIĘ</button>
        <button class="btn-outline" onclick="handleRegister()" data-i18n="btn_register" style="margin-top:10px;">REJESTRACJA</button>
    </div>

    <div id="app-interface" style="display:none;">
        <section id="view-map" class="view-section active">
            <div id="ctrl-panel">
                <button id="btn-center" class="map-ctrl-btn" onclick="centerOnMe()">🎯</button>
                <button class="map-ctrl-btn" style="background:var(--danger); color:white;" onclick="document.getElementById('alert-modal').style.display='flex'">⚠️</button>
            </div>
            <div id="top-widgets">
                <div class="top-pill" onclick="showWeatherAlert()"><span id="weather-icon">☀️</span> <span id="weather-temp">--°C</span></div>
                <div id="active-alert-pill" class="top-pill" onclick="openAlertHub()" style="display:none;">⚠️ Szukam zagrożeń...</div>
            </div>
            <div id="map"></div>
            <div id="walk-setup-panel">
                <div id="walk-inputs-group">
                    <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
                        <img id="myAvatarSmall" src="" style="width:45px; height:45px; border-radius:50%; object-fit:cover; border: 2px solid var(--border-color); flex-shrink:0;">
                        <input type="text" id="statusInput" placeholder="Co u Was?" style="margin:0; flex:1;">
                    </div>
                </div>
                <button class="btn-main" id="startBtn" onclick="startWalk()">WYJDŹ NA SPACER 🐾</button>
                <button class="btn-main" id="stopBtn" onclick="stopWalk()" style="display:none; background:var(--text-color);">ZAKOŃCZ SPACER 🏁</button>
            </div>
        </section>

        <section id="view-community" class="view-section">
            <div style="padding:20px 20px 5px 20px; background:var(--bg-color); position: sticky; top:0; z-index:100;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h3 style="margin:0; font-weight:900; font-size:22px;">W okolicy</h3>
                    <button onclick="openSearchModal()" style="background:var(--panel-bg); color:var(--text-color); border:none; border-radius:50px; font-size:13px; padding:8px 16px; cursor:pointer; font-weight:800; box-shadow:var(--soft-shadow);">🔎 SZUKAJ</button>
                </div>
                <div id="stories-container"></div>
                <button class="btn-main" style="background:var(--secondary); margin-bottom:10px;" onclick="document.getElementById('post-creator-modal').style.display='flex'">➕ DODAJ POSTA</button>
            </div>
            <div id="posts-container" style="padding-bottom: 20px;"></div>
        </section>

        <section id="view-wiki" class="view-section">
            <div style="padding:20px; background:var(--bg-color); position: sticky; top:0; z-index:100;">
                <div class="tab-container">
                    <button id="tab-breeds" class="tab-btn active" onclick="toggleWikiTab('breeds')">RASY</button>
                    <button id="tab-training" class="tab-btn" onclick="toggleWikiTab('training')">TRENING</button>
                </div>
            </div>
            <div id="wiki-breeds-container" style="padding:0 15px 20px;"></div>
            <div id="wiki-training-container" style="display:none; padding:0 15px 20px;"></div>
        </section>

        <section id="view-chat" class="view-section">
            <div id="inbox-container" style="padding:20px;"></div>
        </section>

        <section id="view-profile" class="view-section">
            <div style="padding:30px 20px; text-align:center;">
                <img id="profileAvatar" src="" style="width:120px; height:120px; border-radius:50%; object-fit:cover; margin-bottom:15px; border:4px solid white; box-shadow:var(--soft-shadow);">
                <h2 id="profileNameDisplay" style="margin:0; font-weight:900;">...</h2>
                <button class="btn-main" style="background:var(--border-color); color:var(--text-color); margin-top:20px;" onclick="handleLogout()">WYLOGUJ SIĘ</button>
            </div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchView('map', this)"><span>📍 Mapa</span></button>
            <button class="nav-item" onclick="switchView('community', this)"><span>📱 Tablica</span></button>
            <button class="nav-item" onclick="switchView('wiki', this)"><span>📘 Wiedza</span></button>
            <button class="nav-item" onclick="switchView('chat', this)"><span>💬 Czat</span></button>
            <button class="nav-item" onclick="switchView('profile', this)"><span>👤 Profil</span></button>
        </nav>
    </div>

    <div id="post-creator-modal" class="modal"><div class="card"><button class="close-modal-btn" onclick="this.parentElement.parentElement.style.display='none'">✕</button>
        <h3 style="font-weight:900;">Nowy Post</h3>
        <textarea id="postContent" placeholder="Napisz do stada..."></textarea>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
            <button class="btn-outline" style="flex:1;" onclick="document.getElementById('postCamInput').click()">📷 APARAT</button>
            <button class="btn-outline" style="flex:1;" onclick="document.getElementById('postGalInput').click()">🖼️ GALERIA</button>
            <input type="file" id="postCamInput" accept="image/*" capture="environment" style="display:none;" onchange="uploadPostImage(event)">
            <input type="file" id="postGalInput" accept="image/*" style="display:none;" onchange="uploadPostImage(event)">
        </div>
        <button class="btn-main" onclick="saveCommunityPost()">OPUBLIKUJ</button>
    </div></div>

    <script src="wiki.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA7CSlyOLzbz2LpO0C-KqaZQ0U_OrNqBcg", authDomain: "waggle-app-31ffa.firebaseapp.com", projectId: "waggle-app-31ffa", storageBucket: "waggle-app-31ffa.firebasestorage.app", messagingSenderId: "711707392068", appId: "1:711707392068:web:b81c7e0714cfe24dd1e411" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); const auth = firebase.auth();
        const IMGBB_API_KEY = "af2b35f5ca54dd9c8fc91595fe525de9"; 

        var map, currentUserUid, myDogProfile;
        var myLat, myLng, isWalking = false;
        var lastGpsUpdateTimestamp = 0;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserUid = user.uid;
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    document.getElementById('loader').style.display = 'none';
                    if (doc.exists) { myDogProfile = doc.data(); startApp(); } 
                });
            } else { document.getElementById('loader').style.display = 'none'; document.getElementById('auth-screen').style.display = 'flex'; }
        });

        function startApp() {
            document.getElementById('app-interface').style.display = 'flex';
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('profileNameDisplay').innerText = myDogProfile.name;
            renderExternalWiki();
            initMap();
        }

        function renderExternalWiki() {
            if(typeof WaggleWiki === 'undefined') return;
            let breedsHtml = "";
            WaggleWiki.breeds.forEach(b => {
                breedsHtml += `<div class="post-card"><h3>${b.name}</h3><p>${b.desc}</p></div>`;
            });
            document.getElementById('wiki-breeds-container').innerHTML = breedsHtml;
            let trainingHtml = "";
            WaggleWiki.training.forEach(t => {
                trainingHtml += `<div class="post-card"><h3>${t.title}</h3><p>${t.desc}</p></div>`;
            });
            document.getElementById('wiki-training-container').innerHTML = trainingHtml;
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([50.2, 19.0], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
            navigator.geolocation.watchPosition(pos => {
                myLat = pos.coords.latitude; myLng = pos.coords.longitude;
                if(isWalking && (Date.now() - lastGpsUpdateTimestamp > 15000)) {
                    db.collection("walks").doc(currentUserUid).set({ lat: myLat, lng: myLng, timestamp: Date.now(), name: myDogProfile.name });
                    lastGpsUpdateTimestamp = Date.now();
                }
            });
        }

        function switchView(v, el) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleWikiTab(t) {
            document.getElementById('wiki-breeds-container').style.display = t==='breeds'?'block':'none';
            document.getElementById('wiki-training-container').style.display = t==='training'?'block':'none';
            document.getElementById('tab-breeds').classList.toggle('active', t==='breeds');
            document.getElementById('tab-training').classList.toggle('active', t==='training');
        }

        function handleLogin() { auth.signInWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPass').value); }
        function handleLogout() { auth.signOut().then(() => location.reload()); }
        function startWalk() { isWalking = true; document.getElementById('startBtn').style.display='none'; document.getElementById('stopBtn').style.display='block'; }
        function stopWalk() { isWalking = false; db.collection("walks").doc(currentUserUid).delete().then(() => location.reload()); }
    </script>
</body>
</html>
