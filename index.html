<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Waggle 🐾 Premium UI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d3436">
</head>
<body>
    <div id="loader" style="position:fixed; inset:0; z-index:30000; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:32px;">Waggle🐾</div>
    <div id="waggle-toast"></div>
    <div id="lightbox-modal" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <div id="auth-screen" class="screen-container">
        <div class="auth-card">
            <h1 class="logo-title">Waggle.</h1>
            <p style="margin-bottom: 25px; font-size: 16px; font-weight: 700; color: var(--text-muted);">Dołącz do stada! 🐕</p>
            <input type="email" id="authEmail" placeholder="E-mail">
            <input type="password" id="authPass" placeholder="Hasło">
            <div style="margin-top: 10px;">
                <button class="btn-main" id="loginBtn">ZALOGUJ SIĘ</button>
                <button class="btn-outline" id="registerBtn" style="margin-top: 12px;">REJESTRACJA</button>
            </div>
            <div class="legal-checkbox-container" style="justify-content: center; margin-top: 25px;">
                <input type="checkbox" id="legalTerms">
                <label for="legalTerms" style="font-size: 12px; font-weight: 700; color: var(--text-muted);">Akceptuję Regulamin Waggle.</label>
            </div>
        </div>
    </div>

    <div id="app-interface" class="screen-container">
        <section id="view-map" class="view-section active">
            <div id="map-ui-layer">
                <div id="top-widgets">
                    <div class="top-pill" id="weatherWidgetBtn" style="cursor:pointer;"><span id="weather-temp">☀️ --°C</span></div>
                    <div id="active-alert-pill" class="top-pill" style="display:none; background:var(--danger); color:white; cursor:pointer;">⚠️ Alerty!</div>
                </div>
                <div id="ctrl-panel">
                    <button class="map-ctrl-btn" id="centerBtn">🎯</button>
                    <button class="map-ctrl-btn danger" id="triggerAlertBtn">⚠️</button>
                </div>
                <div id="walk-setup-panel">
                    <input type="text" id="statusInput" placeholder="Co u Was?" style="margin-bottom: 10px;">
                    <button class="btn-main" id="startWalkBtn">WYJDŹ NA SPACER 🐾</button>
                    <button class="btn-main" id="stopWalkBtn" style="display:none; background:var(--text-color);">ZAKOŃCZ 🏁</button>
                </div>
            </div>
            <div id="map"></div>
        </section>

        <section id="view-community" class="view-section">
            <div class="sticky-header">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="margin:0;">W okolicy</h3>
                    <div id="stories-container" style="display:flex; gap:12px; overflow-x:auto; padding:15px 0; margin-bottom:5px; scrollbar-width:none; border-bottom:1px solid var(--border-color);"></div>
                </div>
                <div style="display:flex; gap:10px; overflow-x:auto; padding:10px 0; margin-top:10px; scrollbar-width:none;">
                    <button class="top-pill" style="background:var(--text-color); color:white; border:none; margin:0;">Wszystko</button>
                    <button class="top-pill" style="border:none; margin:0;">📅 Ustawki</button>
                    <button class="top-pill" style="border:none; margin:0;">⚠️ Alerty</button>
                    <button class="top-pill" style="border:none; margin:0;">ℹ️ Info</button>
                </div>
                <button class="btn-main" id="addPostBtn" style="margin-top:10px; padding: 12px; background:var(--secondary);">➕ DODAJ POSTA</button>
                <button class="btn-main" id="addAlertBtnTab" style="margin-top:10px; padding: 12px; background:var(--secondary);">➕ DODAJ ALERT</button>
            </div>
            <div id="posts-container"></div>
        </section>

        <section id="view-wiki" class="view-section">
            <div class="sticky-header" style="padding-bottom: 10px;">
                <h3 style="margin:0;">Psia Wiedza</h3>
                <div class="wiki-tabs">
                    <button class="wiki-tab-btn active" data-tab="rasy" style="background:var(--secondary); color:white;">Rasy Psów</button>
                    <button class="wiki-tab-btn" data-tab="trening">Szkolenie</button>
                    <button class="wiki-tab-btn" data-tab="sytuacje">Sytuacje</button>
                </div>
                <div style="margin-top: 12px; padding: 0 5px;">
                    <input type="text" id="wikiSearchInput" placeholder="Szukaj rasy, objawów lub haseł (np. rzepy, dzieci)..." style="width: 100%; padding: 12px 18px; border-radius: 20px; border: 2px solid var(--border-color); background: var(--bg-color); color: var(--text-color); box-sizing: border-box; font-family: inherit; font-size: 13px;">
                </div>
            </div>
            <div id="wiki-content" style="padding:0 10px; margin-top: 10px;"></div>
        </section>

        <section id="view-chat" class="view-section">
            <div class="sticky-header" style="background:var(--bg-color); z-index:100; padding: 20px 20px 5px 20px;">
                <div style="display:flex; background:var(--panel-bg); border-radius:12px; overflow:hidden; margin-bottom:15px; border:1px solid var(--border-color); padding: 4px;">
                    <button id="chatTabInbox" style="flex:1; padding:12px; border:none; background:#2d3436; font-weight:900; color:white; border-radius:20px; cursor:pointer; font-family:inherit; font-size:13px; transition:0.2s;">ROZMOWY</button>
                    <button id="chatTabSearch" style="flex:1; padding:12px; border:none; background:transparent; font-weight:900; color:var(--text-muted); cursor:pointer; font-family:inherit; font-size:13px; transition:0.2s;">STADO / SZUKAJ</button>
                </div>
                
                <div id="chat-search-view" style="display: none; padding-top: 5px;">
                    <div style="margin-bottom: 10px;">
                        <input type="text" id="userSearchInput" placeholder="Szukaj miasta lub rasy..." oninput="window.Waggle.executeSearch(this.value)" style="width: 100%; padding: 14px 20px; border-radius: 25px; border: 2px solid var(--border-color); background: var(--bg-color); color: var(--text-color); box-sizing: border-box; font-family: inherit;">
                    </div>
                    <div id="users-list" style="max-height: 50vh; overflow-y: auto;"></div>
                </div>
            </div>
            
            <div id="inbox-container"></div>
        </section>

        <section id="view-profile" class="view-section">
            <div class="profile-header" style="padding:30px 20px; text-align:center;">
                <div style="position: relative; width: 120px; height: 120px; margin: 0 auto;">
                    <img id="profileAvatar" src="" style="width:120px; height:120px; border-radius:50%; border:4px solid white; box-shadow:var(--soft-shadow); object-fit:cover;">
                    <div style="position: absolute; bottom: 0; right: 0; background: var(--secondary); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); pointer-events: none; border: 2px solid white;">✎</div>
                </div>
                <h2 id="profileNameDisplay" style="margin: 15px 0 0 0; font-weight:900; font-size:26px;">...</h2>
                <div id="profileLevelDisplay" style="color:#78e08f; font-weight:800; font-size:14px; margin-top:5px; margin-bottom:15px;">🌱 Nowik</div>
                <div class="stats-bar">
                    <div style="flex:1;"><b id="statWalks" class="stat-num" style="color: var(--primary);">0</b><br><small>Spacerów</small></div>
                    <div style="flex:1;"><b id="statDist" class="stat-num" style="color: var(--secondary);">0.0</b><br><small>KM</small></div>
                </div>
                <div class="profile-actions" style="margin-top: 25px; display: flex; flex-direction: column; gap: 15px; padding: 0 10px;">
                    <button class="btn-main" id="openEditProfileBtn" style="background: var(--secondary);">✏️ EDYTUJ PROFIL</button>
                    <button class="btn-main" id="openSettingsBtn" style="background: #576574;">⚙️ USTAWIENIA</button>
                    <button class="btn-outline" id="logoutBtn" style="color: var(--danger); border-color: var(--danger);">WYLOGUJ SIĘ</button>
                </div>
            </div>
        </section>

        <section id="view-places" class="view-section">
            <div class="sticky-header">
                <h3 style="margin:0;">Psie Miejscówki</h3>
                <p style="margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted);">Najbliższe parki i wybiegi</p>
            </div>
            <div id="places-container"></div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" data-view="map">📍<span>Mapa</span></button>
            <button class="nav-item" data-view="community">📱<span>Tablica</span></button>
            <button class="nav-item" data-view="wiki">📘<span>Wiedza</span></button>
            <button class="nav-item" data-view="chat">💬<span>Czat</span></button>
            <button class="nav-item" data-view="places">🌳<span>Miejsca</span></button>
            <button class="nav-item" data-view="profile">👤<span>Profil</span></button>
        </nav>
    </div>

    <div id="chat-window" class="modal" style="z-index: 9999;">
        <div class="card" style="height: 85vh; padding: 0;">
            <div style="background: var(--panel-bg); padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0;">
                <b id="chatPartnerName">...</b>
                <button id="closeChatBtn" class="close-modal-btn" style="position:static; background: none; border: none; font-size: 20px; font-weight: bold; cursor: pointer; color: var(--text-color); width: auto; height: auto;">✕</button>
            </div>
            <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;"></div>
            <div style="padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: var(--bg-color); border-radius: 0 0 20px 20px;">
                <button id="chatAddPhotoBtn" style="background:none; border:none; font-size:20px; cursor:pointer;">📷</button>
                <input type="text" id="chatInput" placeholder="Napisz..." style="flex: 1; margin-bottom: 0;">
                <div id="chat-preview-box" style="display:none; padding:10px;"></div>
                <button class="btn-main" id="sendMsgBtn" style="width: auto; padding: 0 20px;">WYŚLIJ</button>
            </div>
        </div>
    </div>

    <div id="user-action-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <img id="actionUserAvatar" src="" style="width:90px;height:90px;border-radius:50%;margin-bottom:15px;object-fit:cover;border:3px solid var(--secondary);">
            <h3 id="actionUserName">Piesek</h3>
            <button class="btn-main" id="actionMsgBtn" style="background:var(--secondary);">💬 Napisz na Priv</button>
            <button class="btn-outline" id="actionMapBtn" style="display:none; margin-top:10px;">📍 Pokaż na mapie</button>
        </div>
    </div>

    <div id="post-creator-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <textarea id="postContent" placeholder="Co u Was?" style="height:80px;"></textarea>
            <div style="text-align:left; margin-bottom:15px; display:flex; gap:15px; align-items:center;">
                <label><input type="checkbox" id="isEventCheckbox"> 📅 Ustawka</label>
                <label><input type="checkbox" id="isInfoCheckbox"> ℹ️ Info</label>
            </div>
            <div id="eventDetailsInput" style="display:none; margin-top:10px;"><input type="datetime-local" id="eventDate"></div>
            <div id="post-image-preview-container" style="display:none;"><img id="post-image-preview" src="" style="width:100%; border-radius:8px;"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn-outline" id="addPhotoBtn">📷</button>
                <button class="btn-main" id="publishPostBtn">OPUBLIKUJ</button>
            </div>
            <input type="file" id="postImageInput" accept="image/*" style="display:none;">
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <h3>Ustawienia</h3>
            <select id="settingTheme"><option value="light">☀️ Jasny</option><option value="dark">🌙 Ciemny</option></select>
            <select id="settingFontSize">
                <option value="14px">Mała</option>
                <option value="16px">Średnia</option>
                <option value="18px">Duża</option>
            </select>
            
            <div class="legal-checkbox-container" style="margin-bottom: 10px; margin-top: 10px;">
                <input type="checkbox" id="settingSearchable">
                <label for="settingSearchable">Tryb Ducha (przybliżona lokalizacja)</label>
            </div>
            <div class="legal-checkbox-container" style="margin-bottom: 15px;">
                <input type="checkbox" id="settingHidden">
                <label for="settingHidden">Całkowicie ukryty (na mapie i spacerach)</label>
            </div>

            <button class="btn-main" id="saveSettingsBtn">ZAPISZ</button>
        </div>
    </div>

    <div id="profile-setup-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <input type="text" id="setupName" placeholder="Imię">
            <input type="text" id="setupCity" placeholder="Miasto">
            <select id="setupBreed">
                <option value="">Wybierz rasę...</option>
                <option value="Kundelek">Kundelek</option>
                <option value="Golden Retriever">Golden Retriever</option>
                <option value="Owczarek Niemiecki">Owczarek Niemiecki</option>
                <option value="Border Collie">Border Collie</option>
                <option value="Labrador">Labrador</option>
                <option value="Mops">Mops</option>
                <option value="Buldog Francuski">Buldog Francuski</option>
                <option value="Yorkshire Terrier">Yorkshire Terrier</option>
                <option value="Maltańczyk">Maltańczyk</option>
                <option value="Inna rasa">Inna rasa</option>
            </select>
            <button class="btn-main" id="saveProfileBtn">ZAPISZ</button>
        </div>
    </div>

    <div id="alert-modal" class="modal">
        <div class="card">
            <button class="close-modal-btn">✕</button>
            <input type="text" id="alertTextInput" placeholder="Co się dzieje?" style="margin-bottom: 15px;">
            <button class="btn-outline" id="alertAddPhotoBtn" style="margin-bottom: 15px; border-color: var(--primary); color: var(--primary);">📷 Dodaj zdjęcie zagrożenia</button>
            <button class="btn-main" id="saveAlertBtn">ZGŁOŚ</button>
        </div>
    </div>

    <div id="weather-modal" class="modal">
        <div class="card"><button class="close-modal-btn">✕</button><div id="weather-forecast-content"></div></div>
    </div>

    <div id="comments-modal" class="modal" style="z-index: 9999;">
        <div class="card" style="height: 85vh; display: flex; flex-direction: column; padding: 0;">
            <div style="background: var(--panel-bg); padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0;">
                <b style="font-size: 18px; color: var(--text-color);">Komentarze</b>
                <button class="close-modal-btn" style="position:static; background: none; border: none; font-size: 20px; font-weight: bold; cursor: pointer; color: var(--text-color); width: auto; height: auto;">✕</button>
            </div>
            <div id="comments-list" style="flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;"></div>
            <div style="padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: var(--bg-color); border-radius: 0 0 20px 20px;">
                <input type="text" id="commentInput" placeholder="Napisz komentarz..." style="flex: 1; padding: 12px; border-radius: 20px; border: 1px solid var(--border-color); margin-bottom: 0;">
                <button class="btn-main" id="sendCommentBtn" style="width: auto; padding: 0 20px; border-radius: 20px; flex-shrink: 0; white-space: nowrap;">OK</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
    <script type="module" src="/src/app.js?v=999"></script>

<div id="wiki-details-modal" class="modal" style="z-index: 10000;">
    <div class="card" style="display: flex; flex-direction: column; padding: 0; overflow-y: auto; background: var(--bg-color);">
        
        <button id="closeWikiDetailsBtn" class="close-modal-btn" style="position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: white; z-index: 10005;">✕</button>

        <div style="width: 100%; height: 250px; flex-shrink: 0;">
            <img id="wikiDetailsImg" src="" style="width: 100%; height: 100%; object-fit: cover; object-position: center center;">
        </div>

        <div class="wiki-text-content">
            <h2 id="wikiDetailsTitle" style="margin: 0 0 10px 0; font-weight: 900; font-size: 24px; color: var(--text-color);">...</h2>
            <div id="wikiDetailsTags" style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;"></div>
            <div id="wikiDetailsStats" style="margin-bottom: 20px; background: var(--panel-bg); padding: 15px; border-radius: 16px; border: 1px solid var(--border-color); display: none;"></div>
            <p id="wikiDetailsDesc" style="font-size: 15px; color: var(--text-muted); line-height: 1.6; font-weight: 600; margin: 0;"></p>
        </div>
    </div>
</div>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(registration => {
          console.log('✅ Service Worker zarejestrowany!', registration.scope);
        })
        .catch(err => {
          console.error('❌ Błąd rejestracji Service Workera:', err);
        });
    });
  }
</script>
</body>
</html>
