<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Waggle 2026 🐾 Full Version</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader">Waggle🐾</div>
    <div id="toast"></div>

    <div id="lightbox-modal" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <!-- EKRAN LOGOWANIA -->
    <div id="auth-screen" class="screen-container">
        <div class="auth-content">
            <h1 style="font-size: 55px; color: var(--primary); font-weight: 900; margin: 0;">Waggle.</h1>
            <p>Dołącz do stada! 🐕</p>
            <input type="email" id="authEmail" placeholder="E-mail">
            <input type="password" id="authPass" placeholder="Hasło">
            <button class="btn-main" id="loginBtn">ZALOGUJ SIĘ</button>
            <button class="btn-outline" id="registerBtn">REJESTRACJA</button>
        </div>
    </div>

    <!-- INTERFEJS APLIKACJI -->
    <div id="app-interface" class="screen-container">
        
        <!-- WIDOK: MAPA -->
        <section id="view-map" class="view-section active">
            <div id="top-widgets">
                <div class="top-pill">☀️ <span id="weather-temp">--°C</span></div>
                <div id="active-alert-pill" class="top-pill" style="display:none; background:var(--danger); color:white;">⚠️ Alerty!</div>
            </div>
            <div id="ctrl-panel">
                <button class="map-ctrl-btn" id="centerBtn">🎯</button>
                <button class="map-ctrl-btn danger" id="triggerAlertBtn">⚠️</button>
            </div>
            <div id="map"></div>
            <div id="walk-setup-panel">
                <input type="text" id="statusInput" placeholder="Co u Was?" style="margin-bottom: 10px;">
                <button class="btn-main" id="startWalkBtn">WYJDŹ NA SPACER 🐾</button>
                <button class="btn-main" id="stopWalkBtn" style="display:none; background:var(--text-color);">ZAKOŃCZ 🏁</button>
            </div>
        </section>

        <!-- WIDOK: TABLICA -->
        <section id="view-community" class="view-section">
            <div style="padding: 20px; background: white; position: sticky; top: 0; z-index: 100;">
                <h3 style="margin:0;">W okolicy</h3>
                <div id="stories-container"></div>
                <button class="btn-main" id="addPostBtn" style="margin-top:15px;">➕ DODAJ POSTA</button>
            </div>
            <div id="posts-container"></div>
        </section>

        <!-- WIDOK: WIEDZA -->
        <section id="view-wiki" class="view-section">
            <div style="padding: 20px; background: white; position: sticky; top: 0; z-index: 100;">
                <h3 style="margin:0;">Psia Wiedza</h3>
            </div>
            <div id="wiki-container"></div>
        </section>

        <!-- WIDOK: CZAT -->
        <section id="view-chat" class="view-section">
            <div style="padding: 20px; background: white; position: sticky; top: 0; z-index: 100;">
                <h3 style="margin:0;">Wiadomości</h3>
            </div>
            <div id="inbox-container"></div>
            <div id="chat-window" class="chat-overlay">
                <div class="chat-header">
                    <button id="closeChatBtn">←</button>
                    <b id="chatPartnerName">Czat</b>
                </div>
                <div id="chatMessages"></div>
                <div class="chat-footer">
                    <input type="text" id="chatInput" placeholder="Napisz wiadomość...">
                    <button id="sendMsgBtn">OK</button>
                </div>
            </div>
        </section>

        <!-- WIDOK: PROFIL -->
        <section id="view-profile" class="view-section">
            <div class="profile-header" style="text-align: center; padding: 30px 20px;">
                <img id="profileAvatar" src="" style="width:120px; height:120px; border-radius:50%; border:4px solid white; box-shadow:var(--soft-shadow);">
                <h2 id="profileNameDisplay" style="margin: 15px 0 5px 0;">...</h2>
                <div class="stats-bar" style="display: flex; justify-content: space-around; background: white; border-radius: 20px; padding: 20px; margin: 20px 0; box-shadow: var(--soft-shadow);">
                    <div><b id="statWalks" style="font-size: 20px; color: var(--primary);">0</b><br><small>Spacerów</small></div>
                    <div><b id="statDist" style="font-size: 20px; color: var(--secondary);">0.0</b><br><small>KM</small></div>
                </div>
                <button class="btn-main" id="logoutBtn" style="background:var(--border-color); color:var(--text-color);">WYLOGUJ SIĘ</button>
            </div>
        </section>

        <!-- NAWIGACJA DOLNA -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-view="map">📍<span>Mapa</span></div>
            <div class="nav-item" data-view="community">📱<span>Tablica</span></div>
            <div class="nav-item" data-view="wiki">📘<span>Wiedza</span></div>
            <div class="nav-item" data-view="chat">💬<span>Czat</span></div>
            <div class="nav-item" data-view="profile">👤<span>Profil</span></div>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script type="module" src="src/app.js"></script>
</body>
</html>
