<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waggle SAFE - Profil Psa</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --waggle-dark: #2d3436;
            --text-muted: #879296;
            --bg-color: #f8f9fa;
            --primary-btn: #2ecc71;
            --secondary-btn: #f1f2f6;
        }
        body { 
            background: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            font-family: 'Nunito', sans-serif; 
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header-title {
            color: var(--waggle-dark);
            font-weight: 900;
            font-size: 26px;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
        }
         .safe-card { 
            background: white; 
            border-radius: 32px; 
            padding: 40px 24px 30px 24px; 
            width: 100%; 
            max-width: 380px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.04); 
            text-align: center; 
            margin-top: 90px; /* 🔥 TUTAJ ZMIANA Z 40px na 90px */
            position: relative;
        }
        .safe-avatar { 
            width: 150px; 
            height: 150px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 6px solid white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            margin: -90px auto 20px auto; 
            background: white;
            display: block;
        }
        .info-box { 
            background: #e8f5e9; /* Miękki, medyczny zielony */
            border-radius: 20px; 
            padding: 20px; 
            text-align: left; 
            margin-bottom: 25px; 
            border: 1px solid #c8e6c9; 
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-primary {
            background: var(--primary-btn);
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            font-size: 16px; 
            padding: 18px; 
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.3); 
            border-radius: 100px; 
            color: white; 
            font-weight: 900; 
            transition: transform 0.2s;
        }
        .btn-secondary {
            background: var(--secondary-btn);
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            font-size: 15px; 
            padding: 16px; 
            border-radius: 100px; 
            color: var(--waggle-dark); 
            font-weight: 800; 
            transition: transform 0.2s;
        }
        .btn-primary:active, .btn-secondary:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <div style="text-align: center; margin-top: 10px;">
        <h1 class="header-title">🐶 Waggle SAFE</h1>
        <p style="color: var(--text-muted); font-weight: 800; margin: 0; font-size: 15px;">Pomóż mi wrócić do domu</p>
    </div>

    <!-- Ekran ładowania -->
    <div id="loading" style="margin-top: 80px; font-weight: 900; color: #b2bec3; font-size: 16px; text-align: center;">
        <div style="font-size: 40px; margin-bottom: 15px; animation: pulse 1.5s infinite;">🐾</div>
        Wczytuję dane psa...
    </div>

    <!-- Prawidłowy profil psa -->
    <div id="safe-content" class="safe-card" style="display: none;">
        <img id="dogImage" class="safe-avatar" src="" alt="Pies">
        
        <h2 id="dogName" style="font-size: 32px; font-weight: 900; margin: 0 0 5px 0; color: var(--waggle-dark); letter-spacing: -0.5px;">...</h2>
        <p id="dogBreed" style="font-size: 15px; color: var(--text-muted); font-weight: 800; margin: 0 0 25px 0;">...</p>

        <div class="info-box">
            <h3 style="margin: 0 0 12px 0; font-size: 14px; color: #2e7d32; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 18px;">🩺</span> Kartoteka bezpieczeństwa
            </h3>
            <p id="dogNotes" style="margin: 0; font-size: 14px; line-height: 1.7; color: var(--waggle-dark); font-weight: 700;">...</p>
        </div>

        <div class="action-buttons">
            <a id="callBtn" class="btn-primary" href="#">
                <span style="font-size: 20px;">📞</span> ZADZWOŃ DO OPIEKUNA
            </a>
            <a id="smsBtn" class="btn-secondary" href="#">
                <span style="font-size: 20px;">💬</span> NAPISZ WIADOMOŚĆ
            </a>
            <!-- NOWY PRZYCISK LOKALIZACJI -->
            <button id="locationBtn" style="background: transparent; border: 2px solid var(--waggle-dark); color: var(--waggle-dark); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; padding: 14px; border-radius: 100px; font-weight: 800; cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif;">
                <span style="font-size: 20px;">📍</span> WYŚLIJ LOKALIZACJĘ PSA
            </button>
        </div>

    <!-- Komunikat o błędzie -->
    <div id="error-content" class="safe-card" style="display: none; border: 2px solid #ff5252;">
        <div style="font-size: 50px; margin-bottom: 15px;">😢</div>
        <h3 style="color: #ff5252; margin-top: 0; font-weight: 900; font-size: 20px;">Profil niedostępny</h3>
        <p style="color: var(--text-muted); font-size: 14px; font-weight: 700; line-height: 1.6;">
            Ten profil bezpieczeństwa jest nieaktywny.
        </p>
    </div>

    <!-- 🔥 BIBLIOTEKI FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Import logiki bazy i uruchomienie strony -->
    <script type="module">
        import { db } from './src/core/firebase.js';

        async function loadSafeProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const safeId = urlParams.get('id');

            if (!safeId) {
                showError();
                return;
            }

            try {
                const doc = await db.collection("safe_profiles").doc(safeId).get();
                
                if (doc.exists && doc.data().active) {
                    const data = doc.data();
                    
                    document.getElementById('dogName').innerText = data.dogName || "Piesek";
                    document.getElementById('dogBreed').innerText = data.breed || "Rasa nieznana";
                    
                    const notes = data.notes || "Brak dodatkowych informacji medycznych.";
                    document.getElementById('dogNotes').innerHTML = notes.replace(/\n/g, '<br>');
                    
                    const imgEl = document.getElementById('dogImage');
                    imgEl.src = data.imageUrl || "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=300";

                    const callBtn = document.getElementById('callBtn');
                    const smsBtn = document.getElementById('smsBtn');
                    
                    if (data.phone && data.allowPhone) {
                        const cleanPhone = data.phone.replace(/[^0-9+]/g, '');
                        callBtn.href = `tel:${cleanPhone}`; 
                        // Generowanie gotowego linku SMS z predefiniowaną wiadomością
                        smsBtn.href = `sms:${cleanPhone}?body=Hej!%20Znalazłem%20Twojego%20psa%20(${encodeURIComponent(data.dogName)}).%20Proszę%20o%20kontakt!`;
                    } else {
                        callBtn.style.display = 'none'; 
                        smsBtn.style.display = 'none'; 
                    }

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('safe-content').style.display = 'block';
                } else {
                    showError();
                }
            } catch (error) {
                console.error("Błąd pobierania profilu:", error);
                showError();
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-content').style.display = 'block';
        }

        loadSafeProfile();
    </script>
</body>
</html>
